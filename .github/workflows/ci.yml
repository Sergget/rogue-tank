name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax + typecheck
        run: npm run check

      - name: Full Node test chain
        run: npm test

      # 注：npm run test:browser 需要系统 Edge 浏览器，未纳入 CI；
      # 合并前请在本地手动跑通（见 README）。
