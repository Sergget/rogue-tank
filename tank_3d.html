<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue Tank — 3D 切片 (R1)</title>
<style>
  /* 设计令牌由 js/tank_ui.js 注入（唯一来源，见 docs/specs/combat/ui-layout.md）。
     2026-10-27：本页原有一份偏绿的局部 :root（--line:#3a4a3a / --text:#cfe6cf），已并入通用令牌。 */
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg-canvas); overflow:hidden; font-family:var(--font-ui); }
  #c { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:12px; top:12px; font:12px/1.5 'JetBrains Mono',monospace; color:var(--text);
    background:rgba(8,9,6,0.66); border:1px solid var(--line); border-radius:0; padding:6px 10px;
    pointer-events:none; min-width:190px; }
  #hud b { color:var(--amber); font-weight:600; }
  /* P0（2026-10-27）：玩家侧暴露度指示器（与 battle 页同口径、同分档）。
     三档：hidden 隐蔽 / exposed 暴露 / detected 被察觉。色调语义同 battle 页。 */
  #exposureHud{position:fixed; left:12px; top:96px; display:flex; align-items:center; gap:6px;
    font:11px/1.3 'JetBrains Mono',monospace; color:var(--text);
    background:rgba(8,9,6,0.72); border:1px solid var(--line); border-left-width:2px;
    border-radius:0; padding:4px 8px; pointer-events:none; display:none; width:fit-content;}
  #exposureHud .expIcon{width:9px; height:9px; border-radius:50%; flex:0 0 auto;
    border:1.5px solid currentColor; background:transparent;}
  #exposureHud .expLabel{font-weight:700; letter-spacing:1px;}
  #exposureHud .expDetail{opacity:.7; font-size:10px;}
  #exposureHud[data-level="hidden"]{color:var(--green); border-left-color:var(--green);}
  #exposureHud[data-level="exposed"]{color:var(--amber); border-left-color:var(--amber);}
  #exposureHud[data-level="detected"]{color:#ff6b6b; border-left-color:#ff6b6b;}
  #exposureHud[data-level="hidden"] .expIcon{background:currentColor;}
  #exposureHud[data-level="detected"] .expIcon{background:currentColor;
    box-shadow:0 0 0 2px rgba(255,107,107,0.25);}
  #allyHud { position:fixed; left:12px; bottom:52px; font:11px/1.45 'JetBrains Mono',monospace; color:var(--text);
    background:rgba(8,9,6,0.62); border:1px solid var(--line); border-radius:0; padding:4px 8px;
    pointer-events:none; min-width:170px; display:none; }
  #allyHud .ord { color:var(--amber); }
  #toast, #perfNotice { position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    font:12px 'JetBrains Mono',monospace; color:var(--text); background:rgba(8,9,6,0.72);
    border:1px solid var(--line); border-radius:0; padding:3px 12px; display:none; pointer-events:none; }
  /* 画质提示**独占一格**：不能和战斗 toast 抢同一个槽位。
     实测「友军受阻」会把「画质自动降至中」顶掉——玩家只看到一条无关提示，
     画面却已经变糊，等于没有解释。右上角 + 琥珀色，与战斗消息视觉上分开。 */
  #perfNotice { left:auto; right:16px; transform:none; border-color:var(--amber); color:var(--amber); }
  #allyWheel { position:fixed; inset:0; display:none; pointer-events:none; z-index:8;
    background:radial-gradient(circle at 50% 50%, rgba(8,9,6,0) 0 24%, rgba(8,9,6,0.45) 46% 100%); }
  #allyWheel .item { position:absolute; transform:translate(-50%,-50%);
    font:13px 'JetBrains Mono',monospace; color:var(--text); background:rgba(8,9,6,0.78);
    border:1px solid var(--line); border-radius:999px; padding:4px 14px; white-space:nowrap; }
  #allyWheel .item.sel { color:#08100a; background:var(--amber); border-color:var(--amber); }
  #allyWheel .hint { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font:11px 'JetBrains Mono',monospace; color:#9ab; white-space:nowrap; }
  #r1Check { position:fixed; right:12px; top:12px; width:300px; display:block;
    font-family:'JetBrains Mono',monospace; font-size:var(--fs-xs); line-height:1.6; color:var(--text);
    background:rgba(8,9,6,0.72); border:1px solid var(--line); border-radius:0;
    padding:7px 10px; pointer-events:none; }
  #r1Check b { color:var(--amber); font-weight:600; }
  #r1Check .ok { color:#8f8; }
  #r1Check .bad { color:var(--red); }
  #r1Check .dim { color:#9ab; }
  #help { position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font:11px 'JetBrains Mono',monospace; color:#9ab; background:rgba(8,9,6,0.6);
    border:1px solid var(--line); border-radius:0; padding:4px 12px; pointer-events:none; white-space:nowrap; }
  /* G1（2026-10-28）：完整遭遇 HUD。三块信息必须同屏可读——「第几波」「还剩几个」「现在处于什么节拍」，
     缺任何一块玩家都只能靠猜（波次导演的可读性支柱）。 */
  #encHud { position:fixed; left:12px; top:150px; min-width:210px; pointer-events:none;
    font:var(--fs-body)/1.5 'JetBrains Mono',monospace; color:var(--text);
    background:rgba(8,9,6,0.66); border:1px solid var(--line); border-left-width:2px;
    border-radius:0; padding:6px 10px; display:none; }
  #encHud .wave { color:var(--amber); font-weight:700; letter-spacing:1px; }
  #encHud .beat { font-size:var(--fs-xs); opacity:.85; }
  #encHud[data-beat="telegraph"]{ border-left-color:#ff6b6b; }
  #encHud[data-beat="wave"]{ border-left-color:var(--amber); }
  #encHud[data-beat="breather"]{ border-left-color:var(--green); }
  /* 来袭预警：屏幕边缘红闪 + 中央方位提示（telegraph 期间） */
  #encWarn { position:fixed; inset:0; pointer-events:none; display:none; z-index:7;
    box-shadow:inset 0 0 90px 12px rgba(255,80,60,0.55); }
  #encWarn .txt { position:absolute; left:50%; top:20%; transform:translate(-50%,-50%);
    font:bold 20px/1.3 'JetBrains Mono',monospace; color:#ffd9d0; text-shadow:0 0 12px rgba(255,80,60,0.9);
    white-space:nowrap; letter-spacing:2px; }
  /* 结算覆盖层 */
  #encResult { position:fixed; inset:0; display:none; z-index:9; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 45%, rgba(8,9,6,0.72) 0 30%, rgba(8,9,6,0.92) 100%); }
  #encResult .card { min-width:320px; text-align:center; padding:18px 26px;
    border:1px solid var(--line); background:rgba(8,9,6,0.86); }
  #encResult .title { font:bold 26px/1.3 'JetBrains Mono',monospace; letter-spacing:4px; }
  #encResult.win .title { color:var(--green); }
  #encResult.lose .title { color:var(--red); }
  #encResult .grade { font:bold 40px/1.1 'JetBrains Mono',monospace; color:var(--amber); margin:4px 0 2px; }
  #encResult .rows { font:var(--fs-body)/1.7 'JetBrains Mono',monospace; color:var(--text); margin:8px 0 10px; }
  #encResult .rows span { color:var(--amber); }
  #encResult .hint { font:var(--fs-xs) 'JetBrains Mono',monospace; color:#9ab; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font:14px 'JetBrains Mono',monospace; color:var(--text); background:#080a07; }
</style>
<script src="js/tank_ui.js"></script>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="hud">R1 · 3D 切片<br><span id="hudBody">加载中…</span></div>
<div id="exposureHud" data-level="hidden">
  <span class="expIcon"></span><span class="expLabel" id="expLabel">隐蔽</span><span class="expDetail" id="expDetail"></span>
</div>
<div id="allyHud"></div>
<div id="encHud" data-beat="telegraph"></div>
<div id="r1Check"></div>
<div id="toast"></div>
<div id="perfNotice"></div>
<div id="encWarn"><div class="txt"></div></div>
<div id="encResult"><div class="card">
  <div class="title"></div>
  <div class="grade"></div>
  <div class="rows"></div>
  <div class="hint">按 R 重新开战</div>
</div></div>
<div id="allyWheel">
  <div class="hint">松开 Z 执行 · 鼠标选方向</div>
  <div class="item" data-order="follow" style="left:50%; top:30%">跟随玩家</div>
  <div class="item" data-order="move" style="left:66%; top:62%">移动到光标</div>
  <div class="item" data-order="focus" style="left:34%; top:62%">集火目标</div>
</div>
<div id="help">WASD 驾驶 · 鼠标瞄准 · 左键开火 · Z 跟随 / X 移动 / C 集火 · R 弹夹整装（结算后重开） · F1 验证清单</div>
<div id="boot">加载 R1 切片…</div>

<script src="js/tank_rules.js"></script>
<script src="js/tank_perf.js"></script>
<script src="js/tank_utils.js"></script>
<script src="js/tank_geometry.js"></script>
<script src="js/tank_halfgeom.js"></script>
<script src="js/tank_model.js"></script>
<script src="js/tank_cover.js"></script>
<!-- P0（2026-10-27）：玩家侧暴露度反馈。3D 切片此前对 AI 状态全盲（无 ?/! 图标、
     无威胁指示、也无任何自身暴露度读数）——本模块补上最后一块可读性。
     纯函数层，读 camouflageValue / aiTriggerDist / aiEngaged 等既有权威源，不新增判定。 -->
<script src="js/tank_exposure.js"></script>
<script src="js/tank_nodegen.js"></script>
<script src="js/tank_map.js"></script>
<script src="js/tank_entity.js"></script>
<script src="js/tank_move.js"></script>
<script src="js/tank_physics.js"></script>
<script src="js/tank_weapons.js"></script>
<script src="js/tank_fire.js"></script>
<script src="js/tank_strike.js"></script>
<script src="js/tank_shield.js"></script>
<script src="js/tank_deployables.js"></script>
<script src="js/tank_ally_command.js"></script>
<script src="js/tank_ai_squad.js"></script>
<script src="js/tank_ai.js"></script>
<!-- G1（2026-10-28）：遭遇导演纯逻辑层（波次状态机 / spawn 提案）。纯函数、无 DOM 依赖，
     页面只做实体生成与演出；可 Node 测试，见 scripts/test-encounter.js。 -->
<script src="js/tank_encounter.js"></script>
<script src="js/tank_bindings.js"></script>
<script src="js/tank_audio.js"></script>
<script src="js/tank_render3d.js"></script>
<script src="js/tank_scene3d.js"></script>
<script>
(function(){
'use strict';

const SEED = 20261027;
const STEP = 1 / 120;
const canvas = document.getElementById('c');
// G1 性能预算：两档实机尺度都从 URL 指定（?w=1920&h=1080 / ?w=1280&h=800）。
// 这里是**基准渲染分辨率**；实际渲染分辨率 = 基准 × 当前性能档的 resolutionScale，
// 由 applyRenderScale() 统一改写（CSS 撑满视口，所以缩放只影响清晰度、不影响布局与判定）。
const BASE_RES = (function(){
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w')) || 0, h = Number(q.get('h')) || 0;
  if(w >= 320 && h >= 240) return { w: w | 0, h: h | 0 };
  return { w: 1280, h: 720 };
})();
canvas.width = BASE_RES.w; canvas.height = BASE_RES.h;

// ---------------- 性能护栏（G1，2026-10-28） ----------------
// 纯逻辑在 js/tank_perf.js（governor 门控 + 档位阶梯），页面只做三件事：
//   ① 把 resolutionScale 落到 canvas 尺寸 ② 按档位裁粒子/炮弹/扬尘 ③ 节流静态几何重建
// 降级优先级（先降玩家最不易察觉的）：分辨率 → 环境粒子(扬尘) → 战斗粒子 → 几何重建频率。
// **绝不降级**：模拟步长(1/120)、输入采样、HUD 刷新、炮弹碰撞判定、AI 决策频率。
const PERF_RULES = (typeof RULES !== 'undefined' && RULES.perf) ? RULES.perf : null;
const PERF_ON = !!(PERF_RULES && PERF_RULES.enabled !== false);
// ?perf=manual：只由测试喂帧时间，忽略真实 rAF 帧时间。
// 用途是让「降级阶梯」可复现——软件渲染（CI 的 swiftshader）帧时间动辄 80ms+，
// 真实帧会把档位一路打到 deck，阶梯断言就永远测不到 mid 那一级。
const PERF_MANUAL = (new URLSearchParams(location.search).get('perf') === 'manual');
// 档位的中文名（只用于给玩家的提示文案；代码里一律用 high/mid/deck 这三个键）
const PERF_TIER_LABEL = { high: '高', mid: '中', deck: '低' };
const PERF_START_TIER = (function(){
  // 档位由 URL 指定，不做设备嗅探（UA 嗅探在桌面浏览器上不可靠，且会掩盖真实性能）。
  // 必须用 hasOwnProperty：`?tier=constructor` 之类会命中原型链上的 Object 成员，
  // 得到一个「存在的」函数，随后 resolutionScale 取到 undefined → 画布尺寸算成 NaN。
  const q = (new URLSearchParams(location.search).get('tier') || '').toLowerCase();
  if(PERF_RULES && PERF_RULES.tiers && Object.prototype.hasOwnProperty.call(PERF_RULES.tiers, q)){
    return q;
  }
  return PERF_RULES ? (PERF_RULES.startTier || 'high') : 'high';
})();
// enabled=false（基线截图 / A/B 对照）时不建档，直接固定 startTier 档 —— 档位漂移会让基线不可复现。
let perfGov = (PERF_ON && typeof createGovernor === 'function')
  ? createGovernor({ rules: PERF_RULES, startTier: PERF_START_TIER })
  : null;
let perfCfg = (function(){
  if(perfGov && typeof getTierConfig === 'function') return getTierConfig(perfGov, PERF_RULES);
  // enabled=false：读固定档位，不做 governor（getTierConfig 需要 gov，这里手工取同一份表）
  const t = (PERF_RULES && PERF_RULES.tiers && PERF_RULES.tiers[PERF_START_TIER]) || null;
  if(!t) return { name: 'off', resolutionScale: 1, particleCap: Infinity, dustIntervalS: 0.09, maxShells: 40 };
  return {
    name: PERF_START_TIER, resolutionScale: t.resolutionScale, particleCap: t.particleCap,
    dustIntervalS: t.dustIntervalS, maxShells: t.maxShells,
  };
})();

/** 把当前档位的分辨率缩放落到画布。只在档位变化时调用（改尺寸会重分配 framebuffer，有一帧 hitch）。 */
function applyRenderScale(scale){
  // 防线：非法缩放值（undefined / NaN / ≤0）一律按 1 处理。
  // canvas.width 赋 NaN 是「静默变 0」——画面全黑但没有任何报错，最难排查的一类故障。
  const s = (typeof scale === 'number' && isFinite(scale) && scale > 0) ? scale : 1;
  const w = Math.max(320, Math.round(BASE_RES.w * s));
  const h = Math.max(240, Math.round(BASE_RES.h * s));
  if(canvas.width === w && canvas.height === h) return false;
  canvas.width = w; canvas.height = h;
  return true;
}
applyRenderScale(perfCfg.resolutionScale || 1);

/** 当前 EMA 帧时间（一位小数；未采样时返回 '—'，别把 null 渲染成 0.0 骗人）。 */
function perfEmas(){
  const v = perfGov && perfGov.emaMs;
  return (typeof v === 'number' && isFinite(v)) ? v.toFixed(1) : '—';
}

/**
 * 粒子统一入口：硬上限由档位决定，超了丢**最老的**（老粒子已经飞远/快消散，丢它最不可见）。
 * 环境粒子（履带扬尘）不靠这里裁，靠档位的 dustIntervalS 自然变稀 —— 那是「先降氛围」。
 */
function addParticle(p){
  const cap = perfCfg.particleCap;
  while(particles.length >= cap) particles.shift();
  particles.push(p);
}

const renderer = createRenderer(canvas);
if(!renderer){
  document.getElementById('boot').textContent = 'WebGL 不可用：R1 切片需要 WebGL1。';
  return;
}

// ---------------- 世界状态 ----------------
const shells = [];
const impacts = [];
const bounceFx = [];
const particles = [];
// 粒子峰值（开局以来）：单帧采样会漏掉齐射瞬间的尖峰，而尖峰正是降级的触发条件
let particlePeak = 0;
const mouseWorld = { x: 0, y: 0 };
const coverHp = new Map();
let shakeT = 0, shakeMag = 0;
let tankListData = {};
let node = null, player = null, cam = null;
let timeScale = 1;
let fireHeld = false;
let staticMesh = null;
let dynamicMesh = null;
let coverSig = '';
let staticRebuildT = 0;
let lastImpactCount = 0;
let lastTank = 0;
let shotsFired = 0;
let frameCount = 0, fpsT = 0, fpsVal = 0;
let spawnPoint = { x: 0, y: 0 };

const ORDER_LABEL = { follow: '跟随', move: '移动', focus: '集火' };
const PHASE_LABEL = { moving: '行进', holding: '驻守', blocked: '受阻' };

function livingAllies(){
  return entities.filter(e => e && e.team === 'ally' && e.hp > 0 && e.isAllySquad === true);
}
function worldBounds(){
  return node ? { minX: 0, minY: 0, maxX: node.w, maxY: node.h } : null;
}
function toast(msg, bad){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.color = bad ? 'var(--red)' : 'var(--text)';
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = 'none'; }, 2000);
}
function isLethalWaterAt(x, y){
  for(const c of covers){
    if(!c || c.hp <= 0) continue;
    if(c.tier !== 'water' && c.tier !== 'river') continue;
    const dx = x - c.x, dy = y - c.y;
    const ang = -(c.angle || 0);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if(Math.abs(lx) <= (c.w || 0) / 2 && Math.abs(ly) <= (c.h || 0) / 2) return true;
  }
  return false;
}
function commandCtx(){
  return {
    entities, player,
    world: node ? { w: node.w, h: node.h } : null,
    isLethal: isLethalWaterAt,
    allyCommand: RULES.allyCommand,
    hasLoS: hasLineOfSight,
  };
}
function pickEnemyAtWorld(x, y, radius){
  let best = null, bd = radius || 90;
  for(const e of entities){
    if(!e || e.team !== 'enemy' || e.hp <= 0) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function executeAllyOrder(order, at){
  const allies = livingAllies();
  if(!allies.length){ toast('没有可用友军', true); return null; }
  const w = at || mouseWorld;
  const hit = pickEnemyAtWorld(w.x, w.y, 90);
  const spec = buildCommandSpec({ order, hitEntity: hit, player, mouse: w, issuedAt: performance.now() });
  const res = issueAllyCommand(allies, spec, commandCtx());
  if(res.reason){
    const why = {
      'target-missing': '光标下没有敌方目标', 'target-dead': '目标已死亡',
      'target-not-enemy': '目标不是敌人', 'anchor-missing': '缺少目的地',
      'anchor-out-of-bounds': '目的地在地图外', 'anchor-lethal': '目的地是致命水域',
      'no-allies': '没有可用友军', 'unknown-order': '未知命令',
    }[res.reason] || res.reason;
    toast('命令被拒绝：' + why, true);
    return res;
  }
  toast(`${ORDER_LABEL[spec.order] || spec.order} · ${res.issued.length} 辆友军`);
  return res;
}

// 命令转盘：2026-10-27 用户裁定暂时关闭（改用 Z/X/C 直接快捷键）；实现保留。
const ALLY_WHEEL_ENABLED = !!(RULES.allyCommand && RULES.allyCommand.wheelEnabled);
const allyWheel = { open: false, order: null, timer: null, downAt: 0, world: null };
const lastMouseClient = { x: canvas.width / 2, y: canvas.height / 2 };
function updateAllyWheelSelection(){
  if(!allyWheel.open) return;
  const rect = canvas.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const order = radialOrderFor(lastMouseClient.x - cx, lastMouseClient.y - cy, 30);
  allyWheel.order = order;
  const el = document.getElementById('allyWheel');
  if(el) el.querySelectorAll('.item').forEach(it => it.classList.toggle('sel', it.dataset.order === order));
}
function showAllyWheel(){
  allyWheel.open = true;
  allyWheel.world = { x: mouseWorld.x, y: mouseWorld.y };
  const el = document.getElementById('allyWheel');
  if(el) el.style.display = 'block';
  updateAllyWheelSelection();
}
function hideAllyWheel(){
  allyWheel.open = false;
  allyWheel.order = null;
  allyWheel.world = null;
  const el = document.getElementById('allyWheel');
  if(el) el.style.display = 'none';
}
window.addEventListener('keydown', e => {
  if(!ALLY_WHEEL_ENABLED) return;
  if(e.key.toLowerCase() !== 'z' || e.repeat) return;

/**
 * 视觉悬挂（G1）：加减速俯仰、转向侧倾、开炮后坐弹跳与履带扬尘。
 * 只写 `t._vis*` 与粒子，不改 `t.speed/x/y/angle`。
 */
function updateTankVisual(t, dt, prevSpeed, prevAngle){
  const acc = ((t.speed || 0) - prevSpeed) / Math.max(dt, 1e-4);
  const turnRate = angDiff(t.hullAngle || 0, prevAngle) / Math.max(dt, 1e-4);
  const k = 1 - Math.exp(-dt * 8);
  const targetPitch = Math.max(-0.07, Math.min(0.07, acc * 0.00045));
  const targetRoll = Math.max(-0.06, Math.min(0.06, -turnRate * Math.abs(t.speed || 0) * 0.00003));
  t._visPitch = (t._visPitch || 0) + (targetPitch - (t._visPitch || 0)) * k;
  t._visRoll = (t._visRoll || 0) + (targetRoll - (t._visRoll || 0)) * k;
  t._visBounce = (t._visBounce || 0) * Math.exp(-dt * 10);

  if(!t.isDrone && Math.abs(t.speed || 0) > 110){
    t._dustT = (t._dustT || 0) + dt;
    if(t._dustT > perfCfg.dustIntervalS){
      t._dustT = 0;
      const ca = Math.cos(t.hullAngle || 0), sa = Math.sin(t.hullAngle || 0);
      const back = (t.hullLen || 60) * 0.45;
      const bx = t.x - ca * back, by = t.y - sa * back;
      // 履带扬尘是**环境氛围**，降级时第一个变稀（dustIntervalS 按档位放大）
      addParticle({
        x: bx + (Math.random() - 0.5) * 12, y: by + (Math.random() - 0.5) * 12, z: 5,
        vx: -ca * 22 + (Math.random() - 0.5) * 16, vy: -sa * 22 + (Math.random() - 0.5) * 16,
        vz: 10 + Math.random() * 10, life: 0.7, maxLife: 0.7,
        size: 4 + Math.random() * 5, color: [0.55, 0.50, 0.40],
      });
    }
  } else {
    t._dustT = 0;
  }
}

// 切片不再是「6 个敌人开局一拥而上的沙盒」：改由 js/tank_encounter.js 的波次状态机驱动
// 3 波攻势 + 波间喘息 + 胜负判定。本页只做三件事：生成实体、演出、把结果画出来。
//   数值唯一口径 = RULES.encounter（js/tank_rules.js），页面不写死任何波次数值。
//   RULES.encounter.enabled=false 时退回旧沙盒（node.enemies 预生成），便于 A/B 对照。
let encounter = null;
let encOutcome = null;        // null | 'victory' | 'defeat'
let encStats = null;
let encWarnText = '';
let enemySeq = 0;
let lastEnemyAlive = 0;
// 切片专用演示缩放（RULES.encounter，口径见 js/tank_rules.js）：玩家与友军 maxHp 倍率。
// 友军同样要放大——否则补员补进来的是 80 血的纸车，W2/W3 里瞬秒，补员机制形同虚设。
let hpScale = 1;

/** 方位中文标签（HUD 用）：世界坐标 y 向下，0=东、+π/2=南、-π/4=东北。 */
const BEARING_TABLE = [
  [0, '东'], [Math.PI / 4, '东南'], [Math.PI / 2, '南'], [3 * Math.PI / 4, '西南'],
  [Math.PI, '西'], [-3 * Math.PI / 4, '西北'], [-Math.PI / 2, '北'], [-Math.PI / 4, '东北'],
];
function bearingLabel(a){
  let best = '前方', bd = Infinity;
  for(const row of BEARING_TABLE){
    const d = Math.abs(angDiff(a, row[0]));
    if(d < bd){ bd = d; best = row[1]; }
  }
  return best;
}
function enemyTankIds(){
  return Object.keys(tankListData).filter(id => id !== 'dummy');
}

/** 点是否落在矩形掩体内（无 verts 的掩体走这条：full / wall / tree / bush 等多数是矩形 OBB）。 */
function pointInCoverRect(x, y, c){
  const dx = x - c.x, dy = y - c.y;
  const ang = -(c.angle || 0);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
  return Math.abs(lx) <= (c.w || 0) / 2 && Math.abs(ly) <= (c.h || 0) / 2;
}

/** spawn 点合法性（模块用它过滤候选点）：出界 / 致命水域 / 压掩体 / 压实体 一律不许生成。 */
/**
 * spawn 点合法性（模块用它过滤候选点）：出界 / 致命水域 / 压掩体 / 压实体 一律不许生成。
 * 返回**原因字符串**（可用 = null）——「为什么这点不能用」是调出生点时的第一手信息，
 * 只回 boolean 的话每次排查都要重新二分一遍。
 */
function spawnBlockedWhy(x, y){
  if(!node) return 'no-node';
  if(x < 40 || y < 40 || x > node.w - 40 || y > node.h - 40) return 'out-of-bounds';
  if(isLethalWaterAt(x, y)) return 'water';
  const R = 34;   // 车体外接半径：中心 + 四向探针，避免半截身子卡在楼里出场
  for(const c of covers){
    if(!c || c.hp <= 0) continue;
    if(c.tier === 'road') continue;                        // 路面可以落车
    const rr = Math.max(c.w || 0, c.h || 0) / 2 + 60;      // 粗筛：包围盒外直接跳过
    if(Math.abs(x - c.x) > rr || Math.abs(y - c.y) > rr) continue;
    // 两类掩体几何：带 verts 的多边形（水塘/岩石等）走 coverWorldPolygon，
    // 其余是 w/h/angle 的矩形 OBB —— 直接把无 verts 的丢给 coverWorldPolygon 会抛错
    // （tank_cover.js 只读 cov.verts），实测本图多数掩体无 verts。
    if(Array.isArray(c.verts) && c.verts.length >= 3){
      const poly = (typeof coverWorldPolygon === 'function') ? coverWorldPolygon(c) : null;
      if(poly && poly.length >= 3){
        if(pointInPolygon({ x, y }, poly)) return 'cover:' + c.tier;
        if(pointInPolygon({ x: x + R, y }, poly)) return 'cover:' + c.tier;
        if(pointInPolygon({ x: x - R, y }, poly)) return 'cover:' + c.tier;
        if(pointInPolygon({ x, y: y + R }, poly)) return 'cover:' + c.tier;
        if(pointInPolygon({ x, y: y - R }, poly)) return 'cover:' + c.tier;
      }
    } else {
      if(pointInCoverRect(x, y, c)) return 'cover:' + c.tier;
      if(pointInCoverRect(x + R, y, c)) return 'cover:' + c.tier;
      if(pointInCoverRect(x - R, y, c)) return 'cover:' + c.tier;
      if(pointInCoverRect(x, y + R, c)) return 'cover:' + c.tier;
      if(pointInCoverRect(x, y - R, c)) return 'cover:' + c.tier;
    }
  }
  for(const e of entities){
    if(!e || e.hp <= 0) continue;
    if(Math.hypot(e.x - x, e.y - y) < 70) return 'entity:' + e.id;
  }
  return null;
}
function spawnBlocked(x, y){ return !!spawnBlockedWhy(x, y); }

function encounterCtx(){
  return {
    playerAlive: !!player && player.hp > 0,
    playerPos: { x: player ? player.x : 0, y: player ? player.y : 0 },
    enemyAlive: entities.filter(e => e.team === 'enemy' && e.hp > 0).length,
    allyAlive: livingAllies().length,
    world: node ? { w: node.w, h: node.h } : { w: 1440, h: 864 },
    isBlocked: spawnBlocked,
  };
}

function spawnWaveUnits(waveIdx, units){
  const ids = enemyTankIds();
  // 切片专用演示缩放（RULES.encounter.enemyDamageScale，口径见 js/tank_rules.js）：
  // 实测首波 3 辆对静止玩家是 60 hp/s（4 秒打穿 240 血），没有决策窗口；×0.5 ⇒ 30 hp/s。
  const dmgScale = (RULES.encounter && RULES.encounter.enemyDamageScale) || 1;
  const out = [];
  for(const u of units){
    const t = spawnTank({
      id: `enemy_w${waveIdx}_${enemySeq++}`,
      team: 'enemy',
      x: u.x, y: u.y,
      hullAngle: u.hullAngle, turretAngle: u.hullAngle,
      heightClass: u.cls,
    });
    t.nodeSpawn = true;
    t.tankClass = u.cls;
    t.aiTier = 0;
    t.aiReactEnabled = true;
    if(ids.length) applyTankConfig(t, tankListData[ids[enemySeq % ids.length]]);
    resetEntity(t);
    if(dmgScale !== 1 && t.base){
      t.base.damage = (t.base.damage || t.stats.damage || 0) * dmgScale;
      if(typeof refreshStats === 'function') refreshStats(t);
    }
    t.hp = t.stats.maxHp;
    // 进攻意志（G1 必需）：AI 激活门控要求「距离 ≤ triggerDist 且有 LoS」才置 aiEngaged，
    // 未激活只做 patrol 原地微摆 ⇒ 不强制 engaged 的话，玩家一龟缩这局就永远打不完。
    t.aiEngaged = true;
    t.lastKnownPlayerPos = player ? { x: player.x, y: player.y } : null;
    // 入场反应延迟（G1）：不设的话敌人一出场就有 LoS 且炮塔已对准玩家（hullAngle 直指玩家），
    // 会**出场即齐射**——实测玩家在看见敌人之前就吃满一轮、1 秒内被打穿。
    // aiReactT>0 期间 AI 只转炮塔、不移动、不开火（js/tank_ai.js:807），
    // 这 1.5s 同时是「炮塔起转」的演出窗口和玩家抢占掩体的决策窗口。
    t.aiReactT = (RULES.encounter && RULES.encounter.entryReactSeconds) || 0;
    out.push(t);
  }
  return out;
}

/** intel 事件：把玩家当前方位刷给所有活着的敌人（语义：进攻方指挥部持续更新你的方位）。 */
function refreshEnemyIntel(){
  if(!player) return;
  for(const e of entities){
    if(e.team !== 'enemy' || e.hp <= 0) continue;
    e.aiEngaged = true;
    e.lastKnownPlayerPos = { x: player.x, y: player.y };
  }
}

/** 友军血量放大（与玩家同 scale，见 hpScale 声明处）。 */
function scaleAllyHp(t){
  if(hpScale !== 1 && t && t.base){
    t.base.maxHp = (t.base.maxHp || t.stats.maxHp || 0) * hpScale;
    if(typeof refreshStats === 'function') refreshStats(t);
  }
}

/** 喘息期补员：在玩家附近的合法点落车（不用地图边缘，否则友军要跑半分钟才归队）。 */
function reinforceAllies(n, salt){
  if(n <= 0 || !player) return 0;
  const rng = createRNG((SEED + 977 * (salt || 1)) | 0);
  const allyTankId = (RULES.allyCommand && RULES.allyCommand.allyTankId) || null;
  let added = 0;
  for(let i = 0; i < n; i++){
    let x = 0, y = 0, ok = false;
    for(let k = 0; k < 30; k++){
      const a = rng.range(0, TAU);
      const d = rng.range(120, 220);
      x = player.x + Math.cos(a) * d; y = player.y + Math.sin(a) * d;
      if(!spawnBlocked(x, y)){ ok = true; break; }
    }
    if(!ok) continue;
    const t = spawnTank({ id: `ally_rf_${enemySeq++}`, team: 'ally', x, y, hullAngle: 0, turretAngle: 0, heightClass: 'medium' });
    t.nodeSpawn = true;
    t.isAllySquad = true;
    t._allyIndex = livingAllies().length;
    t._allyCount = Math.max(1, n);
    if(allyTankId && tankListData[allyTankId]) applyTankConfig(t, tankListData[allyTankId]);
    resetEntity(t);
    scaleAllyHp(t);
    t.hp = t.stats.maxHp;
    issueAllyCommand([t], { order: 'follow', issuedAt: performance.now() }, commandCtx());
    added++;
  }
  return added;
}

function currentWaveLabel(){
  const waves = (RULES.encounter && RULES.encounter.waves) || [];
  const w = waves[encounter ? encounter.waveIndex : 0];
  return w ? (w.label || w.id) : '—';
}

/** 评级（切片验收用）：胜利才评级，失败不给安慰奖。
 *  rationale：S=又快又稳（剩 ≥70% 血且 4 分钟内）、A=还能站着承压（≥40% 且 5 分钟内）、
 *  B=赢了但狼狈。切片的目标体验是「打得漂亮」，所以门槛按「剩余装甲 + 用时」双轴给。 */
function gradeFor(s){
  if(!s || s.outcome !== 'victory') return '—';
  const hp = s.hpPct || 0, sec = s.seconds || 0;
  if(hp >= 0.7 && sec <= 240) return 'S';
  if(hp >= 0.4 && sec <= 300) return 'A';
  return 'B';
}

function finishEncounter(outcome, stats){
  encOutcome = outcome;
  encStats = Object.assign({}, stats || {}, {
    outcome,
    hpPct: player && player.stats.maxHp ? Math.max(0, player.hp) / player.stats.maxHp : 0,
    allies: livingAllies().length,
    grade: '—',
  });
  encStats.grade = gradeFor(encStats);
  encWarnText = '';
  const el = document.getElementById('encResult');
  if(el){
    const sec = (encStats.seconds || 0).toFixed(0);
    el.className = outcome === 'victory' ? 'win' : 'lose';
    el.querySelector('.title').textContent = outcome === 'victory' ? '任务完成' : '任务失败';
    el.querySelector('.grade').textContent = encStats.grade;
    el.querySelector('.rows').innerHTML =
      `用时 <span>${sec}s</span> · 击杀 <span>${encStats.kills}</span> · 清波 <span>${encStats.wavesCleared}/${encounter ? encounter.waveCount : 3}</span><br>`
      + `剩余装甲 <span>${Math.round((encStats.hpPct || 0) * 100)}%</span> · 友军存活 <span>${encStats.allies}</span>`;
    el.style.display = 'flex';
  }
  const warnEl = document.getElementById('encWarn');
  if(warnEl) warnEl.style.display = 'none';
}

function handleEncounterEvent(ev){
  switch(ev.type){
    case 'telegraph': {
      const dirs = (ev.bearings || []).map(bearingLabel).join(' / ');
      encWarnText = `第 ${(ev.wave | 0) + 1} 波来袭 · ${dirs || '前方'}`;
      break;
    }
    case 'spawn': {
      const list = spawnWaveUnits(ev.wave | 0, ev.units || []);
      toast(`${ev.waveLabel || ('第 ' + ((ev.wave | 0) + 1) + ' 波')} · ${list.length} 辆`, true);
      break;
    }
    case 'wave-clear':
      toast(`第 ${(ev.wave | 0) + 1} 波清除`);
      break;
    case 'breather': {
      const pct = ev.repairPct || 0;
      let healed = 0;
      if(player){
        healed = Math.round((player.stats.maxHp || 0) * pct);
        player.hp = Math.min(player.stats.maxHp, player.hp + healed);
      }
      for(const a of livingAllies()){
        a.hp = Math.min(a.stats.maxHp, a.hp + Math.round((a.stats.maxHp || 0) * pct));
      }
      const added = reinforceAllies(ev.reinforce || 0, (encounter ? encounter.waveIndex : 0) + 1);
      toast(`喘息 ${Math.round(ev.seconds)}s · 抢修 +${healed} · 补员 ${added}`);
      break;
    }
    case 'intel':
      refreshEnemyIntel();
      break;
    case 'victory':
      finishEncounter('victory', ev.stats);
      break;
    case 'defeat':
      finishEncounter('defeat', ev.stats);
      break;
  }
}

function restartEncounter(){
  const idx = entities.indexOf(player);
  if(idx >= 0) entities.splice(idx, 1);
  shells.length = 0; impacts.length = 0; bounceFx.length = 0; particles.length = 0;
  coverHp.clear(); coverSig = ''; staticRebuildT = 0; lastImpactCount = 0;
  shotsFired = 0; enemySeq = 0; lastEnemyAlive = 0;
  encOutcome = null; encStats = null; encWarnText = '';
  const el = document.getElementById('encResult');
  if(el) el.style.display = 'none';
  initWorld();
}

function buildFireCtx(){
  return {
    player, shells, impacts, bounceFx, entities, covers, mouseWorld,

    playSound: (name) => { if(typeof playSound === 'function') playSound(name); },

}
let fireCtx = null;

function buildEnemies(gen, tanks){
  const rng = createRNG((SEED + 4241) | 0);
  const ids = Object.keys(tanks).filter(id => id !== 'dummy');
  const px = gen.w * 0.12, py = gen.h * 0.5;
  const list = [];
  for(let i = 0; i < 6; i++){
    let x = 0, y = 0, tries = 0;
    do {
      x = rng.range(gen.w * 0.50, gen.w * 0.94);
      y = rng.range(gen.h * 0.15, gen.h * 0.85);
      tries++;
    } while(Math.hypot(x - px, y - py) < 320 && tries < 40);
    list.push({
      x, y,
      hullAngle: Math.PI, turretAngle: Math.PI,
      heightClass: i % 4 === 0 ? 'heavy' : 'medium',
      tankId: ids.length ? ids[i % ids.length] : 'dummy',
      tankClass: i % 4 === 0 ? 'heavy' : 'medium',
      aiTier: 0,
      aiReactEnabled: false,
    });
  }
  return list;
}

function initWorld(){
  // R1：一张小战场（1200×720 方形竞技场），不走 run 链。
  const gen = generateNode(0.45, { seed: SEED, scale: 1.8 });
  // G1：遭遇模式接管敌人投放 ⇒ 不再预生成敌人（node.enemies 为空，由波次状态机 spawn）。
  // enabled=false 时退回旧沙盒（6 敌预生成），保留 A/B 对照路径。
  const encEnabled = !!(RULES.encounter && RULES.encounter.enabled);
  node = {
    index: 0,
    w: gen.w, h: gen.h,
    covers: gen.covers,
    template: gen.template,
    difficulty: 0.45,
    seed: SEED,
    biome: 'grass',
    biomeZones: [],
    outpost: null,
    // G1：出生点从 0.12w 内移到 0.25w。原位置贴着西侧边界（x≈173），往西倒车 173px 就贴边，
    // 实测「持续倒车」只能把承伤从 31 降到 22.8 hp/s（26%）——不是机动没收益，是无处可退。
    // 内移后西向纵深 358px，机动才是一个真实可选项；同时缓解「正西方位纵深不足」导致的
    // 兜底出生点过近（W3 那颗 heavy 曾落到 414px）。
    playerSpawn: { x: gen.w * 0.25, y: gen.h * 0.5 },
    enemies: encEnabled ? [] : buildEnemies(gen, tankListData),
  };
  spawnPoint = { x: node.playerSpawn.x, y: node.playerSpawn.y };  const ids = Object.keys(tankListData);
  const playerTankId = ids[0];
  player = spawnTank({ id: 'player', team: 'player', x: node.playerSpawn.x, y: node.playerSpawn.y, hullAngle: 0, turretAngle: 0, heightClass: 'medium' });
  if(playerTankId) applyTankConfig(player, tankListData[playerTankId]);
  resetEntity(player);
  // G1 切片专用演示缩放（RULES.encounter.playerHpScale，口径见 js/tank_rules.js）：
  // 正式游戏的有效血量由卡牌/永久升级/维修技能共同堆叠，切片一条都没接入 —— 不缩放就是
  //「80 血对 50 伤害」，出场两发即毁，遭遇只剩 30 秒。只写 base + refreshStats，不动 stats 直写。
  // 友军同 scale：否则友军每波秒灭，喘息期的补员机制等于空转。
  hpScale = (RULES.encounter && RULES.encounter.playerHpScale) || 1;
  if(hpScale !== 1 && player.base){
    player.base.maxHp = (player.base.maxHp || player.stats.maxHp || 0) * hpScale;
    if(typeof refreshStats === 'function') refreshStats(player);
  }
  player.hp = player.stats.maxHp;
  player.ammoKey = 'ap';

  materializeNode(node, {
    keepIds: ['player'],
    setCovers(list){ covers.length = 0; covers.push(...list); snapshotCovers(); },
    clearEntities(keepIds){
      for(let i = entities.length - 1; i >= 0; i--){
        if(!keepIds.includes(entities[i].id)) entities.splice(i, 1);
      }
    },
    spawnTank(spec){ return spawnTank(spec); },
    configureTank(t, tankId){
      const spec = tankListData[tankId];
      if(spec) applyTankConfig(t, spec);
      resetEntity(t);
    },
    applyDifficulty(t, mults){
      if(!mults) return;
      const s = t.stats;
      if(mults.maxHp){ s.maxHp *= mults.maxHp; t.hp = s.maxHp; }
      if(mults.penetration) s.penetration *= mults.penetration;
      if(mults.damage) s.damage *= mults.damage;
      if(mults.maxSpeed) s.maxSpeed *= mults.maxSpeed;
    },
  });

  // 友军编队（R1 切片保留 2 辆用于验证指挥）
  const allyTankId = (RULES.allyCommand && RULES.allyCommand.allyTankId) || playerTankId;
  for(const spec of allySquadSpecs(node, 'standard', RULES.allyCommand)){
    const t = spawnTank({ id: spec.id, team: spec.team, x: spec.x, y: spec.y, hullAngle: 0, turretAngle: 0, heightClass: spec.heightClass });
    t.nodeSpawn = true;
    t.isAllySquad = true;
    t._allyIndex = spec._allyIndex;
    t._allyCount = spec._allyCount;
    if(allyTankId && tankListData[allyTankId]) applyTankConfig(t, tankListData[allyTankId]);
    resetEntity(t);
    scaleAllyHp(t);
    t.hp = t.stats.maxHp;
    issueAllyCommand([t], { order: 'follow', issuedAt: performance.now() }, commandCtx());
  }

  for(const c of covers) coverHp.set(c, { hp: c.hp, tier: c.tier });
  cam = createOrbitCamera({ pitch: 0.95, distance: 1150, fovY: 0.85 });
  updateOrbitCamera(cam, { x: player.x, z: player.y }, canvas.width / canvas.height);
  staticMesh = uploadMesh(renderer, buildStaticScene({ node, covers }));
  dynamicMesh = uploadMesh(renderer, []);
  fireCtx = buildFireCtx();
  mouseWorld.x = player.x + 200;
  mouseWorld.y = player.y;
  // G1：遭遇状态机（纯逻辑层，seed 固定 ⇒ 波次与出生点可复现）
  encounter = encEnabled ? createEncounter({ seed: SEED, rules: RULES.encounter }) : null;
  lastEnemyAlive = 0;
  document.getElementById('boot').style.display = 'none';
}

// ---------------- 模拟 ----------------
function update(dt){
  if(!player) return;
  // 终局（G1）：冻结战斗——不再 drive / 开火 / AI，只保留粒子与相机，画面不僵死
  if(encOutcome){ stepParticles(dt); updateCameraFollow(dt); return; }

  // G1 遭遇导演：先按存活差分统计击杀（含友军击杀），再推进波次状态机。
  // 顺序不能反：spawn 当帧的存活数是「变多」，差分只认「变少」，不会误计击杀。
  const aliveNow = entities.filter(e => e.team === 'enemy' && e.hp > 0).length;
  if(encounter && lastEnemyAlive > aliveNow) encounter.kills += (lastEnemyAlive - aliveNow);
  lastEnemyAlive = aliveNow;
  if(encounter){
    for(const ev of updateEncounter(encounter, dt, encounterCtx())) handleEncounterEvent(ev);
    if(encOutcome){ stepParticles(dt); updateCameraFollow(dt); return; }   // 本帧判出胜负 → 立即冻结
  }

  // 炮弹同屏上限（性能护栏）：每发炮弹是独立几何，超了丢**最老的**。
  // 炮弹飞行 0.5~1.5s，老弹已是尾段，丢它几乎不可见；不能丢最新的（那等于吞掉刚开的一炮，玩家会以为卡弹）。
  const shellCap = perfCfg.maxShells;
  while(shells.length > shellCap) shells.shift();

  const keys = input.keys;
  const drive = input.driveArgs ? input.driveArgs() : {
    turn: (keys.a ? 1 : 0) - (keys.d ? 1 : 0),
    move: (keys.w ? 1 : 0) - (keys.s ? 1 : 0),
  };
  const prevSpeed = player.speed || 0, prevAngle = player.hullAngle || 0;
  driveTank(player, dt, { turn: drive.turn, move: drive.move, worldBounds: worldBounds() });
  updateTankVisual(player, dt, prevSpeed, prevAngle);

  // 炮塔朝鼠标（与正式游戏同口径：转速限制）
  const desired = Math.atan2(mouseWorld.y - player.y, mouseWorld.x - player.x);
  const diff = angDiff(desired, player.turretAngle);
  const maxStep = (player.stats.turretTurnRate || 1) * dt;
  player.turretAngle = norm(player.turretAngle + Math.max(-maxStep, Math.min(maxStep, diff)));

  // 装填与武器状态机（与正式游戏同口径；缺这一步会导致开一炮后永远 reloadT>0）
  if(player.reloadT > 0) player.reloadT = Math.max(0, player.reloadT - dt);
  if(typeof updatePrimaryHeat === 'function') updatePrimaryHeat(player, dt);
  if(typeof updatePrimaryBarrels === 'function' && player._dbState) updatePrimaryBarrels(player, dt);
  if(typeof updatePrimaryClip === 'function') updatePrimaryClip(player, dt, fireCtx);

  if(fireHeld && player.reloadT <= 0 && fireCtx){
    if(tryFirePrimary(fireCtx)){
      shotsFired++;
      player._visBounce = Math.max(player._visBounce || 0, 3.6);
      shakeT = Math.max(shakeT, 0.16); shakeMag = Math.max(shakeMag, 2.6);
    }
  }

  const aiCtx = {
    player, entities, covers, dt,
    allyCommand: RULES.allyCommand,
    enemies: entities.filter(e => e.team === 'enemy' && e.hp > 0),
    hasLoS: hasLineOfSight,
    findCoversOnPath,
    worldBounds: worldBounds(),
  };
  for(const e of entities){
    if(e.id === 'player' || e.hp <= 0 || e.isDrone) continue;
    if(e.reloadT > 0) e.reloadT = Math.max(0, e.reloadT - dt);
    if(typeof updatePrimaryHeat === 'function') updatePrimaryHeat(e, dt);
    if(typeof updatePrimaryBarrels === 'function' && e._dbState) updatePrimaryBarrels(e, dt);
    if(typeof updatePrimaryClip === 'function') updatePrimaryClip(e, dt, fireCtx);
    if(e.team === 'ally'){
      const ev = updateAllyOrder(e, dt, aiCtx);
      if(ev && ev.type === 'blocked') toast(`友军受阻：${ev.reason === 'target-lost' ? '目标丢失' : '无法推进'}`, true);
    }
    const d = aiDecide(e, aiCtx);
    const ePrevSpeed = e.speed || 0, ePrevAngle = e.hullAngle || 0;
    driveTank(e, dt, { turn: d.turn, move: d.move, worldBounds: worldBounds() });
    updateTankVisual(e, dt, ePrevSpeed, ePrevAngle);
    const td = angDiff(d.turretDesired, e.turretAngle);
    const ms = (e.stats.turretTurnRate || 1) * dt;
    e.turretAngle = norm(e.turretAngle + Math.max(-ms, Math.min(ms, td)));
    if(d.fire){
      const target = e.team === 'ally' ? allyFireTargetFor(e, aiCtx) : player;
      if(target && target.hp > 0 && fireTank(e, target, 'auto', fireCtx)){
        e._visBounce = Math.max(e._visBounce || 0, 2.2);
        if(Math.hypot(e.x - player.x, e.y - player.y) < 420){
          shakeT = Math.max(shakeT, 0.1); shakeMag = Math.max(shakeMag, 1.6);
        }
      }
    }
  }
  resolveTankCollisions();
  stepShells(dt, fireCtx);

  // 命中烟尘
  if(impacts.length > lastImpactCount){
    for(let i = lastImpactCount; i < impacts.length; i++){
      const im = impacts[i];
      if(!im) continue;
      spawnPuffs(im.x, im.y, 8, [0.50, 0.44, 0.34]);
      spawnPuffs(im.x, im.y, 3, [0.95, 0.75, 0.30]);   // 火花
      if(Math.hypot(im.x - player.x, im.y - player.y) < 420){
        shakeT = Math.max(shakeT, 0.1); shakeMag = Math.max(shakeMag, 1.8);
      }
    }
  }
  lastImpactCount = impacts.length;

  // 基础破坏：掩体 tier/hp 变化时重建静态几何（建筑倒塌 → 低矮残骸）
  // 重建是 O(掩体数) 的几何生成，降级时拉长观察间隔（第三优先级：玩家只在楼倒下的瞬间看得出差别）
  staticRebuildT += dt;
  if(staticRebuildT >= (perfCfg.staticRebuildIntervalS || 0.25)){
    staticRebuildT = 0;
    const sig = covers.map(c => c.tier + ':' + (c.hp | 0)).join('|');
    if(sig !== coverSig){
      coverSig = sig;
      // 破坏扬尘：hp 下降或 tier 变化时在掩体处冒尘
      for(const c of covers){
        const prev = coverHp.get(c);
        if(!prev){ coverHp.set(c, { hp: c.hp, tier: c.tier }); continue; }
        if(c.hp < prev.hp || c.tier !== prev.tier){
          spawnPuffs(c.x, c.y, 6, [0.55, 0.50, 0.42]);
          if(Math.hypot(c.x - player.x, c.y - player.y) < 480){
            shakeT = Math.max(shakeT, 0.12); shakeMag = Math.max(shakeMag, 2.0);
          }
        }
        prev.hp = c.hp; prev.tier = c.tier;
      }
      const data = buildStaticScene({ node, covers });
      if(staticMesh) updateMesh(renderer, staticMesh, data);
      else staticMesh = uploadMesh(renderer, data);
    }
  }

  stepParticles(dt);

  // 玩家阵亡：遭遇模式下由状态机判 defeat（下一帧 ctx.playerAlive=false），不再回出生点；
  // 沙盒模式（encounter 关闭）沿用旧的「满状态回出生点」。
  if(player.hp <= 0 && !encounter){
    resetEntity(player);
    player.hp = player.stats.maxHp;
    player.x = spawnPoint.x; player.y = spawnPoint.y;
    toast('玩家阵亡 — 已回到出生点', true);
  }

  updateCameraFollow(dt);
}

/** 粒子步进（终局冻结态也要跑，否则结算画面上烟尘会僵在半空）。 */
function stepParticles(dt){
  if(particles.length > particlePeak) particlePeak = particles.length;
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.vz -= 55 * dt; p.vx *= 0.985; p.vy *= 0.985;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

/** 相机跟随 + 震屏衰减（终局冻结态也保留，画面不僵死）。 */
function updateCameraFollow(dt){
  if(!player) return;
  const leadX = player.x + (mouseWorld.x - player.x) * 0.12;
  const leadY = player.y + (mouseWorld.y - player.y) * 0.12;
  // 视野大于战场时把相机居中，避免玩家贴边时半屏是地图外
  const aspect = canvas.width / canvas.height;
  const halfH = Math.tan(cam.fovY / 2) * cam.distance * 0.85;
  const halfW = halfH * aspect;
  const tx = node && node.w > halfW * 2 ? Math.max(halfW, Math.min(node.w - halfW, leadX)) : (node ? node.w / 2 : leadX);
  const ty = node && node.h > halfH * 2 ? Math.max(halfH, Math.min(node.h - halfH, leadY)) : (node ? node.h / 2 : leadY);
  shakeT = Math.max(0, shakeT - dt);
  const shakeAmp = shakeT > 0 ? shakeMag * Math.min(1, shakeT / 0.16) : 0;
  const shx = (Math.random() - 0.5) * shakeAmp;
  const shy = (Math.random() - 0.5) * shakeAmp;
  updateOrbitCamera(cam, { x: tx + shx, z: ty + shy }, aspect);
}

// ---------------- 渲染 ----------------
function render(){
  if(!staticMesh) return;
  const b = createMeshBuilder();
  for(const t of entities){
    if(t.hp <= 0 || t.isDrone) continue;
    const data = buildTankMesh(t);
    applyTankTilt(data, t, t._visPitch || 0, t._visRoll || 0, t._visBounce || 0);
    for(let i = 0; i < data.length; i++) b.data.push(data[i]);
  }
  const fx = buildDynamicFx(shells, particles);
  for(let i = 0; i < fx.length; i++) b.data.push(fx[i]);
  // 2026-10-27：友军淡绿 / 敌军红 阵营环（贴地）
  const rings = buildTeamRings(entities);
  for(let i = 0; i < rings.length; i++) b.data.push(rings[i]);
  updateMesh(renderer, dynamicMesh, b.data);
  drawScene(renderer, { meshes: [staticMesh, dynamicMesh], cam });
}

// ---------------- HUD ----------------
function renderHud(){
  const body = document.getElementById('hudBody');
  if(!body || !player) return;
  const alive = entities.filter(e => e.team === 'enemy' && e.hp > 0).length;
  const reload = player.reloadT > 0 ? `${player.reloadT.toFixed(2)}s` : '就绪';
  body.innerHTML = `HP <b>${Math.max(0, player.hp | 0)}/${player.stats.maxHp | 0}</b> · 装填 <b>${reload}</b><br>`
    + `敌军 <b>${alive}</b> · 友军 <b>${livingAllies().length}</b> · 炮弹 <b>${shells.length}</b>`;
  const el = document.getElementById('allyHud');
  const allies = livingAllies();
  if(!allies.length){ el.style.display = 'none'; }
  else {
    el.innerHTML = '<div style="opacity:.75">友军 ALLIES</div>' + allies.map(a => {
      const o = a._allyOrder;
      const ord = o ? (ORDER_LABEL[o.order] || o.order) : '待命';
      const ph = o ? (PHASE_LABEL[o.phase] || o.phase) : '';
      return `<div>${a.id.replace(/^ally_/, '友')} <span class="ord">${ord}${ph ? '·' + ph : ''}</span></div>`;
    }).join('');
    el.style.display = 'block';
  }

  // P0（2026-10-27）：玩家侧暴露度指示器。3D 切片此前对 AI 状态全盲——
  //   无敌方 ?/! 图标、无威胁指示、也无自身暴露度读数，玩家对「有没有被发现」零感知。
  //   本指示器与 battle 页同口径（同一 exposureFor 纯函数、同一分档语义）。
  const expBox = document.getElementById('exposureHud');
  if(expBox){
    if(typeof exposureFor !== 'function'){ expBox.style.display = 'none'; }
    else {
      let info = null;
      try{ info = exposureFor(player, entities); } catch(e){ info = null; }
      if(!info){ expBox.style.display = 'none'; }
      else {
        expBox.style.display = 'flex';
        expBox.setAttribute('data-level', info.level);
        const lbl = document.getElementById('expLabel');
        const det = document.getElementById('expDetail');
        if(lbl) lbl.textContent = info.label;
        if(det){
          if(info.level === 'detected'){
            det.textContent = info.watchers > 1 ? `${info.watchers} 辆锁定` : '已锁定';
          } else if(info.level === 'exposed'){
            det.textContent = info.suspect > 0 ? `被搜索 ×${info.suspect}` : `${Math.round(info.effDist)}px`;
          } else {
            det.textContent = `${Math.round(info.effDist)}px`;
          }
        }
      }
    }
  }
  renderEncHud();
  renderR1Check();
}

/** G1 遭遇 HUD：三块信息同屏可读——第几波 / 还剩几个 / 当前节拍（来袭·交战·喘息）。
 *  缺任何一块玩家就只能靠猜，波次导演的可读性支柱就塌了。 */
function renderEncHud(){
  const el = document.getElementById('encHud');
  if(!el) return;
  const warnEl = document.getElementById('encWarn');
  if(!encounter){
    el.style.display = 'none';
    if(warnEl) warnEl.style.display = 'none';
    return;
  }
  const waveNo = Math.min(encounter.waveIndex + 1, encounter.waveCount);
  const alive = entities.filter(e => e.team === 'enemy' && e.hp > 0).length;
  const mm = Math.floor(encounter.elapsed / 60), ss = Math.floor(encounter.elapsed % 60);
  const time = `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  let beat = '';
  if(encounter.phase === 'telegraph') beat = `来袭 ${Math.max(0, encounter.timer).toFixed(1)}s · 抢占掩体`;
  else if(encounter.phase === 'wave') beat = `交战 · 剩余 ${alive}`;
  else if(encounter.phase === 'breather') beat = `喘息 ${Math.max(0, Math.ceil(encounter.timer))}s · 抢修/补员`;
  else beat = encounter.phase === 'victory' ? '任务完成' : '任务失败';
  el.style.display = 'block';
  el.setAttribute('data-beat', encounter.phase);
  el.innerHTML = `<div class="wave">遭遇 ${waveNo}/${encounter.waveCount} · ${currentWaveLabel()}</div>`
    + `<div class="beat">${beat}</div>`
    + `<div class="beat">用时 ${time} · 击杀 ${encounter.kills}</div>`;

  if(warnEl){
    // 文案未就绪时不要显示：首帧 renderEncHud 可能早于第一次 update()（acc < STEP 时
    // update 一次都不跑），此时 phase 已是 telegraph 但 telegraph 事件还没发出、
    // encWarnText 仍是空串 —— 结果是屏幕上闪 0~150ms 的一个空框。
    const on = encounter.phase === 'telegraph' && encWarnText !== '';
    warnEl.style.display = on ? 'block' : 'none';
    if(on){
      // 3Hz 闪烁：足够抓眼又不至于像警报器一样烦（telegraph 只有 2s）
      warnEl.style.opacity = (Math.floor(encounter.timer * 6) % 2) ? '0.45' : '0.95';
      const txt = warnEl.querySelector('.txt');
      if(txt) txt.textContent = encWarnText;
    }
  }
}

/** R1 验收清单：把「这个 demo 要验证什么」直接画在页面上（F1 隐藏）。 */
function renderR1Check(){
  const el = document.getElementById('r1Check');
  if(!el || !player) return;
  const pick = rayGroundHit(cam, canvas.width / 2, canvas.height / 2, canvas.width, canvas.height);
  const pickD = pick ? Math.hypot(pick.x - cam.target.x, pick.y - cam.target.z) : Infinity;
  const pickOk = pickD < 5;
  const reload = player.reloadT > 0 ? player.reloadT.toFixed(1) + 's' : '就绪';
  const allies = livingAllies();
  const allyTxt = allies.length ? allies.map(a => {
    const o = a._allyOrder;
    return `${a.id.replace(/^ally_/, '友')}:${o ? (ORDER_LABEL[o.order] || o.order) : '待命'}·${o ? (PHASE_LABEL[o.phase] || o.phase) : ''}`;
  }).join(' / ') : '无';
  const destroyed = covers.filter(c => c.hp <= 0).length;
  el.innerHTML = [
    '<b>R1 / G1 验证清单（F1 隐藏）</b>',
    `<div>${pickOk ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} 地面拾取与视角中心一致（偏差 ${isFinite(pickD) ? pickD.toFixed(1) : '--'}px）</div>`,
    `<div>${shotsFired > 0 ? '<span class="ok">✓</span>' : '<span class="dim">□</span>'} 主炮连续开火（已开 ${shotsFired} 发 · 装填 ${reload}）</div>`,
    `<div>${allies.length ? '<span class="ok">✓</span>' : '<span class="dim">□</span>'} 友军 Z/X/C 命令（${allyTxt}）</div>`,
    '<div><span class="dim">□</span> 车头/车尾：黄箭头=车头，红尾灯=车尾</div>',
    '<div><span class="dim">□</span> 载具手感：加减速俯仰/侧倾、开炮后坐与扬尘、震屏</div>',
    `<div>${encOutcome ? '<span class="ok">✓</span>' : '<span class="dim">□</span>'} 完整遭遇：${encounter ? `波次 ${Math.min(encounter.waveIndex + 1, encounter.waveCount)}/${encounter.waveCount} · ${encounter.phase}` : '沙盒'}${encOutcome ? ' · ' + (encOutcome === 'victory' ? '胜利' : '失败') : ''}</div>`,
    `<div>${destroyed > 0 ? '<span class="ok">✓</span>' : '<span class="dim">□</span>'} 建筑可破坏（已毁 ${destroyed} / ${covers.length}）</div>`,
    `<div><span class="dim">□</span> 性能护栏：档位 <b>${perfCfg.name}</b> · 渲染 ${canvas.width}×${canvas.height}`
      + ` · 帧 ${perfEmas()}ms · 粒子 ${particles.length}/${perfCfg.particleCap === Infinity ? '∞' : perfCfg.particleCap}</div>`,
    `<div class="dim">FPS ${fpsVal} · 敌军 ${entities.filter(e => e.team === 'enemy' && e.hp > 0).length} · 炮弹 ${shells.length}</div>`,
  ].join('');
}

// ---------------- 主循环 ----------------
let last = performance.now();
let acc = 0;
/**
 * 性能护栏每帧一调：喂**原始 rAF delta**（未钳位、未乘 timeScale）。
 * 钳位后的值会把「切后台回来」退化成 0.2s（不被判为异常帧，白推进降级计时）；
 * timeScale 缩放后的值在终局冻结时是 0，会被当异常帧全部丢掉。
 * 必须在 render() 之后调用：返回的档位作用于**下一帧**，否则会出现「本帧按旧尺寸画完、
 * 却按新档位裁粒子」的半帧状态。
 */
/**
 * 档位变更的唯一副作用入口（真实帧与测试喂帧共用）。
 * 抽出来是为了让「降档要告诉玩家」这条行为可被测试断言——如果只写在 tickPerf 里，
 * 测试驱动（?perf=manual + feed）就永远走不到，这条体验保证会静默烂掉。
 */
function applyTierChange(prevLevel){
  perfCfg = getTierConfig(perfGov, PERF_RULES);
  // 只有档位真的变了才改画布尺寸：改尺寸会重分配 framebuffer，本身就有一帧 hitch
  applyRenderScale(perfCfg.resolutionScale || 1);
  // 降档必须说一声：画面突然变糊、却没有任何解释，玩家只会以为是 bug 或者「这游戏就是糊的」。
  // 升档保持静默——变清晰不需要解释，战斗中途多一次弹字只是噪音。
  if(perfGov.level > prevLevel){
    const label = PERF_TIER_LABEL[perfCfg.name] || perfCfg.name;
    showPerfNotice(`画质自动降至「${label}」（帧率不足）`);
  }
}

/**
 * 画质提示：独立槽位、独立计时，3 秒后自隐。
 * 不用共享的 toast() —— 战斗消息（「友军受阻」这类）会把它顶掉，
 * 玩家最需要解释的那一刻恰好什么都没看到。
 */
function showPerfNotice(msg){
  const el = document.getElementById('perfNotice');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(showPerfNotice._t);
  showPerfNotice._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function tickPerf(rawDt){
  if(!perfGov || typeof updateGovernor !== 'function') return;
  if(PERF_MANUAL) return;    // ?perf=manual：真实帧不参与，只吃测试喂的帧时间
  const prevLevel = perfGov.level;      // 必须在 updateGovernor 之前取：它会就地改写 gov.level
  const r = updateGovernor(perfGov, rawDt);
  if(r && r.changed) applyTierChange(prevLevel);
}

function loop(now){
  const rawDt = (now - last) / 1000;     // 原始帧时间：性能护栏的唯一输入
  let dt = rawDt;
  if(dt > 0.2) dt = 0.2;
  last = now;
  frameCount++;
  if(now - fpsT >= 500){
    fpsVal = Math.round(frameCount * 1000 / Math.max(1, now - fpsT));
    frameCount = 0;
    fpsT = now;
  }
  dt *= timeScale;
  acc += dt;
  while(acc >= STEP){ update(STEP); acc -= STEP; }
  render();
  tickPerf(rawDt);
  if(now - lastTank > 150){ lastTank = now; renderHud(); }
  requestAnimationFrame(loop);
}

// F1：显示/隐藏 R1 验证清单
// 取反必须读**计算样式**：清单默认可见是 CSS 给的，内联 style.display 是空串。
// 直接比 `el.style.display === 'none'` 的话，空串会被当成「已显示」，判定条件永远不成立
// ——虽然在「默认可见」的当前布局下恰好等价，但只要哪天改成默认隐藏就会退化成按两次才出来。
window.addEventListener('keydown', e => {
  if(e.key !== 'F1') return;
  e.preventDefault();
  const el = document.getElementById('r1Check');
  if(!el) return;
  const hidden = getComputedStyle(el).display === 'none';
  el.style.display = hidden ? 'block' : 'none';
});

// R：结算态下重开一局（非结算态 R 是弹夹整装，见 input.actions.reloadClip）
window.addEventListener('keydown', e => {
  if(e.key.toLowerCase() !== 'r' || e.repeat) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
  if(!encOutcome) return;
  e.preventDefault();
  restartEncounter();
});

// ---------------- 启动 ----------------
fetch('api/tanks').then(r => r.json()).then(data => {
  tankListData = data || {};
  initWorld();
  // 首帧时钟必须在这里重置：`last` 在脚本求值时就初始化了，而在这行之前还要跑
  // fetch(api/tanks) + 地图生成 + 静态网格构建（几百毫秒）。不重置的话首个 rawDt
  // 会把这段加载耗时算进「帧时间」，直接污染性能护栏的 EMA（软件渲染下实测能到 150ms+，
  // 然后白跑一段降级计时）。
  last = performance.now();
  requestAnimationFrame(loop);
  requestAnimationFrame(() => { window.__TEST3D__.ready = true; });
}).catch(err => {
  document.getElementById('boot').textContent = '加载坦克数据失败：' + err;
});

// ---------------- 测试钩子 ----------------
window.__TEST3D__ = {
  ready: false,
  /**
   * 性能护栏状态（浏览器链断言 + 人工核对用）。
   * `particlePeak` 是**开局以来**的粒子峰值——单帧采样会漏掉齐射瞬间的尖峰，
   * 而尖峰正是降级的触发条件，所以必须由页面持续记录。
   */
  perf(){
    return {
      enabled: PERF_ON,
      manual: PERF_MANUAL,
      tier: perfCfg.name,
      level: perfGov ? perfGov.level : null,
      emaMs: perfGov ? perfGov.emaMs : null,
      changes: perfGov ? perfGov.changes : 0,
      particleCap: perfCfg.particleCap === Infinity ? null : perfCfg.particleCap,
      particles: particles.length,
      particlePeak,
      maxShells: perfCfg.maxShells,
      shells: shells.length,
      resolutionScale: perfCfg.resolutionScale,
      canvas: { w: canvas.width, h: canvas.height },
      base: { w: BASE_RES.w, h: BASE_RES.h },
      dustIntervalS: perfCfg.dustIntervalS,
      staticRebuildIntervalS: perfCfg.staticRebuildIntervalS || 0.25,
      // 诊断用：手动喂一帧帧时间（不改画质之外的任何状态），验证升降级路径
      feed(dtSeconds){
        if(!perfGov) return null;
        const prev = perfGov.level;
        const r = updateGovernor(perfGov, dtSeconds);
        if(r && r.changed) applyTierChange(prev);   // 与真实帧同一条副作用路径
        return r;
      },
      /** 直接把档位打回起始档（测试收尾用，避免上一段测试的降级污染下一段） */
      reset(){
        perfGov = (PERF_ON && typeof createGovernor === 'function') ? createGovernor({ rules: PERF_RULES, startTier: PERF_START_TIER }) : null;
        perfCfg = perfGov ? getTierConfig(perfGov, PERF_RULES) : perfCfg;
        particlePeak = 0;
        applyRenderScale(perfCfg.resolutionScale || 1);
      },
    };
  },
  state(){
    return {
      player: player ? { x: player.x, y: player.y, hp: player.hp, maxHp: player.stats.maxHp, reloadT: player.reloadT } : null,
      entities: entities.length,
      enemies: entities.filter(e => e.team === 'enemy' && e.hp > 0).length,
      allies: livingAllies().length,
      shells: shells.length,
      shotsFired,
      node: node ? { w: node.w, h: node.h, index: node.index } : null,
      cam: cam ? { eye: cam.eye, target: cam.target, pitch: cam.pitch } : null,
    };
  },
  allies(){
    return livingAllies().map(a => ({
      id: a.id, order: a._allyOrder ? a._allyOrder.order : null,
      phase: a._allyOrder ? a._allyOrder.phase : null,
      targetId: a._allyOrder ? a._allyOrder.targetId : null,
      anchor: a._allyOrder ? a._allyOrder.anchor : null,
    }));
  },
  issue(spec){ return issueAllyCommand(livingAllies(), spec || {}, commandCtx()); },
  executeAllyOrder(order, at){ return executeAllyOrder(order, at); },
  allyWheelState(){ return { open: allyWheel.open, order: allyWheel.order, world: allyWheel.world }; },
  enemyScreen(id){
    const e = entities.find(x => x.id === id);
    if(!e || !cam) return null;
    return projectPoint(cam, e.x, e.y, canvas.width, canvas.height);
  },
  fireTarget(id){
    const a = entities.find(e => e.id === id);
    if(!a) return null;
    const t = allyFireTargetFor(a, { entities, player, allyCommand: RULES.allyCommand, hasLoS: hasLineOfSight });
    return t ? t.id : null;
  },
  pick(sx, sy){ return rayGroundHit(cam, sx, sy, canvas.width, canvas.height); },
  mouseWorld(){ return { x: mouseWorld.x, y: mouseWorld.y }; },
  setMouse(x, y){ mouseWorld.x = x; mouseWorld.y = y; },
  fire(){
    if(!fireCtx) return false;
    const ok = tryFirePrimary(fireCtx);
    if(ok) shotsFired++;
    return ok;
  },
  setTimeScale(s){ timeScale = Number(s) || 0; return timeScale; },
  mem(){
    const m = performance.memory;
    return m ? { usedMB: Math.round(m.usedJSHeapSize / 104857.6) / 10, totalMB: Math.round(m.totalJSHeapSize / 104857.6) / 10 } : null;
  },
  setCamera(opts){
    if(!cam) return null;
    if(opts && typeof opts.pitch === 'number') cam.pitch = opts.pitch;
    if(opts && typeof opts.distance === 'number') cam.distance = opts.distance;
    if(player) updateOrbitCamera(cam, { x: player.x, z: player.y }, canvas.width / canvas.height);
    return { pitch: cam.pitch, distance: cam.distance };
  },
  player(){ return player; },
  entities(){ return entities; },
  covers(){ return covers; },
  // --- G1 遭遇（2026-10-28）---
  encounter(){
    if(!encounter) return { enabled: false, outcome: encOutcome };
    return {
      enabled: true,
      phase: encounter.phase, waveIndex: encounter.waveIndex, waveCount: encounter.waveCount,
      timer: encounter.timer, elapsed: encounter.elapsed, kills: encounter.kills,
      outcome: encOutcome, stats: encStats,
      enemyAlive: entities.filter(e => e.team === 'enemy' && e.hp > 0).length,
      allyAlive: livingAllies().length,
    };
  },
  /** 测试用：一键清场（推进波次的快速路径，不走真实战斗） */
  killAllEnemies(){
    let n = 0;
    for(const e of entities){
      if(e.team === 'enemy' && e.hp > 0){ e.hp = 0; n++; }
    }
    return n;
  },
  /** 测试用：出生点合法性判定（诊断采样成功率用） */
  spawnBlocked(x, y){ return spawnBlocked(x, y); },
  spawnBlockedWhy(x, y){ return spawnBlockedWhy(x, y); },
  /** 测试用：清掉飞行中的炮弹（否则清场后流弹仍会命中玩家，污染喘息期断言） */
  clearShells(){
    const n = shells.length;
    shells.length = 0;
    return n;
  },
  /** 测试用：直接扣玩家血（验证 defeat 链路） */
  damagePlayer(n){
    if(!player) return 0;
    player.hp = Math.max(0, player.hp - (Number(n) || 1));
    return player.hp;
  },
  restart(){ restartEncounter(); return true; },
};
})();
</script>
