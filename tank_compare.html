<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>坦克对比编辑器 · Tank Compare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');
  :root{
    --bg:#12140f;
    --panel:#1a1d15;
    --line:#3a3f2c;
    --amber:#ffb454;
    --amber-dim:#8a6a35;
    --green:#7ed957;
    --red:#ff5c4d;
    --text:#d9dcc9;
    --text-dim:#7a8065;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:'Rajdhani',sans-serif;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:rgba(18,20,15,0.92);border-bottom:1px solid var(--line);
    padding:8px 12px;
  }
  #topbar .title{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--amber-dim);text-transform:uppercase;}
  #topbar .title b{color:var(--amber);}
  #topbar .mono{font-size:10px;color:var(--text-dim);}
  #status{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green);}
  a.navlink{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber-dim);text-decoration:none;border:1px solid var(--line);padding:3px 7px;}
  a.navlink:hover{color:var(--amber);border-color:var(--amber);}
  button{
    background:transparent;border:1px solid var(--amber-dim);color:var(--amber);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;
    padding:6px 10px;cursor:pointer;text-transform:uppercase;
  }
  button:hover{background:rgba(255,180,84,0.1);border-color:var(--amber);}
  #scroll{overflow-x:auto;padding:14px 12px 40px;}
  #columns{display:flex;gap:12px;align-items:flex-start;}
  .col{
    flex:0 0 auto;width:250px;
    background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:10px 10px 12px;
    display:flex;flex-direction:column;gap:3px;
  }
  .col .head{text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;}
  .col .head .name{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);font-weight:700;margin-top:6px;}
  .col canvas{display:block;width:150px;height:90px;background:#0c0d09;border:1px solid var(--line);margin:0 auto;}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;min-height:22px;}
  .mrow .lbl{color:var(--text-dim);flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .mrow .ro{color:var(--text-dim);font-size:10px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  input[type="number"]{
    width:76px;background:#0c0d09;border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 4px;text-align:right;flex-shrink:0;
  }
  input[type="number"]:focus{outline:none;border-color:var(--amber);}
  select{
    background:#0c0d09;border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 4px;flex-shrink:0;
  }
  details{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
  details summary{cursor:pointer;color:var(--amber-dim);}
  details textarea{width:100%;height:120px;background:#0c0d09;border:1px solid var(--line);color:var(--text);font-size:9px;margin-top:4px;}
  #hint{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-left:4px;max-width:900px;line-height:1.6;}
</style>
</head>
<body>
<div id="topbar">
  <span class="title">坦克对比编辑器 <b>TANK COMPARE</b></span>
  <button id="loadBtn">重新载入</button>
  <button id="saveBtn">保存到 tanks/ 目录</button>
  <span id="status"></span>
  <a class="navlink" href="tank_mvp.html">主原型</a>
  <a class="navlink" href="tank_designer.html">设计器</a>
</div>
<div id="scroll">
  <div id="columns"></div>
  <div id="hint">
    说明：本页一列一辆坦克，可直接编辑并保存下列字段。车体/炮塔多边形几何为只读（逻辑由 tank_designer 编辑）；
    每列底部可展开「原始 JSON」查看完整条目。保存逐辆写入 tanks/<id>.json（POST /api/tanks/<id>），无开发服务器时自动改为下载各文件供覆盖。
  </div>
</div>

<script src="js/tank_rules.js"></script>
<script src="js/tank_utils.js"></script>
<script src="js/tank_geometry.js"></script>
<script src="js/tank_halfgeom.js"></script>
<script src="js/tank_model.js"></script>
  <script src="js/tank_paint.js"></script>
  <script src="js/tank_schema.js"></script>
  <script src="js/tank_listio.js"></script>
<script>
(() => {
'use strict';

const statusEl = document.getElementById('status');
const columnsEl = document.getElementById('columns');
let list = null;

function setStatus(t){
  statusEl.textContent = t;
  setTimeout(()=>{ if(statusEl.textContent===t) statusEl.textContent=''; }, 4000);
}

// ---------- 字段描述表（单一来源：js/tank_schema.js） ----------

function getPath(obj, path){
  let v = obj;
  for(const p of path.split('.')){ if(v == null) return undefined; v = v[p]; }
  return v;
}
function setPath(obj, path, val){
  const parts = path.split('.');
  let v = obj;
  for(let i=0;i<parts.length-1;i++){
    if(v[parts[i]] == null) v[parts[i]] = {};
    v = v[parts[i]];
  }
  v[parts[parts.length-1]] = val;
}

// 补齐可编辑字段的结构，保存时不误清几何等字段
function ensureDefaults(spec){
  if(spec.id == null) spec.id = 'unknown';
  if(spec.hull == null) spec.hull = {};
  if(spec.hull.armor == null) spec.hull.armor = {};
  if(spec.turret == null) spec.turret = {};
  if(spec.turret.armor == null) spec.turret.armor = {};
  if(spec.turret.pivot == null) spec.turret.pivot = { dx:0, dy:0 };
  if(spec.barrel == null) spec.barrel = {};
  if(spec.barrel.evac == null){
    // 兼容旧版扁平 evacPos（dummy 等条目）
    if(spec.barrel.evacPos !== undefined){
      spec.barrel.evac = { style: spec.barrel.evacPos>0 ? 'ring' : 'none', pos: Math.abs(spec.barrel.evacPos) };
      delete spec.barrel.evacPos;
    } else {
      spec.barrel.evac = { style:'none', pos:30 };
    }
  }
  if(spec.barrel.jacket == null) spec.barrel.jacket = { len:0, pos:45 };
}

// ---------- 缩略图 ----------
function polyBounds(poly){ return paintBounds(poly.verts); }

function renderThumb(canvas, spec){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const t = makeTank({ x:0, y:0, hullAngle:0, turretAngle:0, team:'enemy', heightClass: spec.heightClass||'medium' });
  applyTankConfig(t, spec);
  const hPoly = hullPoly(t);
  const tPoly = turretPoly(t);
  const hb = polyBounds(hPoly);
  const tb = polyBounds(tPoly);
  const pivot = t.turretPivotOffset || { dx:8, dy:0 };
  const lenSpec = (spec.barrel && spec.barrel.len != null) ? spec.barrel.len : 120;
  const barPct = Math.max(0, Math.min(3, lenSpec/100));
  const barLen = t.turLen * barPct;
  const tipX = pivot.dx + turretFrontDist(t) + barLen;
  const trackOut = Math.abs(t.trackOffset||0) + (t.trackWidth||8);
  const minX = Math.min(hb.minX, tb.minX, -trackOut);
  const maxX = Math.max(hb.maxX, tb.maxX, pivot.dx + tipX);
  const minY = Math.min(hb.minY, tb.minY) - trackOut;
  const maxY = Math.max(hb.maxY, tb.maxY) + trackOut;
  const spanX = Math.max(1, maxX-minX);
  const spanY = Math.max(1, maxY-minY);
  const scale = Math.min(W/(spanX+16), H/(spanY+12));
  ctx.save();
  ctx.translate(W/2 - (minX+spanX/2)*scale, H/2 - (minY+spanY/2)*scale);
  ctx.scale(scale, scale);

  paintTracks(ctx, hPoly.verts, 0, 0, 0, 1, t.color, 0, { trackWidth: t.trackWidth||8, trackOffset: t.trackOffset||0 });
  paintPartTexture(ctx, hPoly.verts, 0, 0, 0, 1, t.color, 'hull', { detail:true, texture: t.texture });
  const hc = polyCorners(0, 0, 0, hPoly);
  ctx.beginPath(); ctx.moveTo(hc[0].x, hc[0].y);
  for(let i=1;i<hc.length;i++) ctx.lineTo(hc[i].x, hc[i].y);
  ctx.closePath(); ctx.strokeStyle = t.color; ctx.lineWidth = 1.2; ctx.stroke();

  const p = turretPivot(t);
  const tCx = p.x, tCy = p.y;
  paintTurretShadow(ctx, tPoly.verts, tCx, tCy, 0, 1, 5, 7, 0);
  paintPartTexture(ctx, tPoly.verts, tCx, tCy, 0, 1, t.color, 'turret', { detail:true, heightClass: t.heightClass, texture: t.texture });
  const tc = polyCorners(tCx, tCy, 0, tPoly);
  ctx.beginPath(); ctx.moveTo(tc[0].x, tc[0].y);
  for(let i=1;i<tc.length;i++) ctx.lineTo(tc[i].x, tc[i].y);
  ctx.closePath(); ctx.strokeStyle = t.color; ctx.lineWidth = 1.2; ctx.stroke();

  const frontOff = turretFrontDist(t);
  const bw = Math.max(2, t.turWid * ((spec.barrel && spec.barrel.width != null) ? spec.barrel.width/100 : 0.18) * 0.5);
  ctx.strokeStyle = t.color; ctx.lineWidth = bw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tCx + frontOff, tCy); ctx.lineTo(tCx + frontOff + barLen, tCy); ctx.stroke();
  ctx.restore();
}

// ---------- 字段行 ----------
// display 元数据（js/tank_schema.js）的读数解析：
//   via:'stats'       → 读同源派生键（computeStats 产出，换算系数唯一权威 RULES.speed.kmhFactor）
//   scale:'pxPerMeter'→ 原始 px ÷ RULES.scale.PX_PER_METER 得米
const STATS_VIA = {
  'maxSpeed':    st => (st && st.maxSpeedKmh !== undefined) ? st.maxSpeedKmh : null,
  'shellSpeed':  st => (st && st.shellSpeedMs !== undefined) ? st.shellSpeedMs : null
};
function displayReadout(f, val, stats){
  const d = f.display;
  if(!d) return null;
  let num = null;
  if(d.via === 'stats'){
    num = STATS_VIA[f.path] ? STATS_VIA[f.path](stats) : null;
  } else if(d.scale === 'pxPerMeter'){
    const ppm = RULES.scale && RULES.scale.PX_PER_METER;
    num = (typeof val === 'number' && ppm) ? val / ppm : null;
  }
  return (num !== null && !isNaN(num)) ? num + ' ' + d.suffix : null;
}

function getEditFactor(f){
  if(!f.edit || !Array.isArray(f.edit.factor)) return null;
  const [sub, key] = f.edit.factor;
  if(RULES && RULES[sub] && typeof RULES[sub][key] === 'number') return RULES[sub][key];
  return null;
}

function renderRowField(spec, f, stats){
  const row = document.createElement('div');
  row.className = 'mrow';
  const lbl = document.createElement('span');
  lbl.className = 'lbl'; lbl.textContent = f.label;
  row.appendChild(lbl);
  const val = getPath(spec, f.path);

  if(f.special === 'spread100m'){
    // 联动输入框：以「100m 散布(m)」口径设定三扩系数 spreadMult
    // spread100m = 100 * SPREAD.base * spreadMult; spreadMult = spread100m / (100 * SPREAD.base)
    const mult = (val !== undefined && val !== null && !isNaN(+val)) ? +val : 1;
    const s100 = (100 * SPREAD.base * mult);
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.01';
    input.value = s100.toFixed(2);
    input.title = '以100m静止散布范围(m)输入，自动折算为底层 spreadMult';
    input.addEventListener('input', ()=>{
      const v = parseFloat(input.value);
      if(!isNaN(v) && v > 0){
        const newMult = v / (100 * SPREAD.base);
        setPath(spec, f.path, +newMult.toFixed(4));
        renderAll();
      }
    });
    row.appendChild(input);
    const ro = document.createElement('span');
    ro.className = 'ro';
    ro.textContent = `(x${mult.toFixed(2)})`;
    ro.title = '底层 spreadMult 倍率';
    row.appendChild(ro);
    return row;
  }

  if(f.type === 'num'){
    const input = document.createElement('input');
    input.type = 'number';
    const factor = getEditFactor(f);
    let displayVal = val;
    if(factor && val !== undefined && val !== null){
      if(f.edit.op === 'div'){
        // 存储值 px/s = km/h ÷ factor(0.4) -> 显示值 km/h = val * factor
        displayVal = Math.round(val * factor);
      } else if(f.edit.op === 'mul'){
        // 存储值 px = m * factor -> 显示值 m = val / factor
        displayVal = +(val / factor).toFixed(2);
      }
    }
    input.value = (displayVal === undefined || displayVal === null) ? '' : +displayVal;
    input.addEventListener('input', ()=>{
      if(input.value === ''){
        setPath(spec, f.path, undefined);
      } else {
        let v = parseFloat(input.value);
        if(!isNaN(v)){
          if(factor){
            if(f.edit.op === 'div') v = v / factor; // km/h 转 px/s
            else if(f.edit.op === 'mul') v = v * factor; // m 转 px
          }
          setPath(spec, f.path, v);
        }
      }
    });
    row.appendChild(input);
  } else if(f.type === 'sel'){
    const sel = document.createElement('select');
    f.options.forEach(o=>{
      const op = document.createElement('option'); op.value = o; op.textContent = o; sel.appendChild(op);
    });
    sel.value = (val === undefined || val === null) ? f.options[0] : String(val);
    sel.addEventListener('change', ()=> setPath(spec, f.path, sel.value));
    row.appendChild(sel);
  }
  return row;
}

// ---------- 精度 σ 读数行（置于 spreadMult/aimSpeed 之后） ----------
// σ_base = SPREAD.base × spreadMult；最差散布 = SPREAD.worstCase() × spreadMult（rad，4 位小数）
// @100m 横向偏移：100m 距离 = 100×PX_PER_METER(px)，偏移px = 距离px×σ(rad)，÷PX_PER_METER 还原为米
// ——PX_PER_METER 分子分母相消，等价于小角近似弧长 100×σ；无该键时直接用弧长近似并注明。
function precisionReadout(sigma){
  const ppm = (RULES.scale && typeof RULES.scale.PX_PER_METER === 'number') ? RULES.scale.PX_PER_METER : null;
  let offM, note = '';
  if(ppm){
    offM = (100 * ppm * sigma) / ppm;
  } else {
    offM = 100 * sigma; // 无 PX_PER_METER 键：用 100×σ(rad) 近似弧长
    note = ' (弧长近似)';
  }
  return sigma.toFixed(4) + ' rad · @100m≈' + offM.toFixed(2) + 'm' + note;
}
function buildPrecisionRows(spec){
  const mult = (spec.spreadMult !== undefined && spec.spreadMult !== null && !isNaN(+spec.spreadMult)) ? +spec.spreadMult : 1;
  const rows = [
    ['精度 σ',      precisionReadout(SPREAD.base * mult)],
    ['最差散布',     precisionReadout(SPREAD.worstCase() * mult)]
  ];
  const frag = document.createDocumentFragment();
  for(const [label, value] of rows){
    const row = document.createElement('div');
    row.className = 'mrow';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = label;
    const ro = document.createElement('span'); ro.className = 'ro'; ro.textContent = value;
    ro.title = 'σ_base = SPREAD.base × spreadMult；最差 = SPREAD.worstCase() × spreadMult（rad）';
    row.appendChild(lbl); row.appendChild(ro);
    frag.appendChild(row);
  }
  return frag;
}

function buildColumn(key, spec){
  const col = document.createElement('div');
  col.className = 'col';

  const head = document.createElement('div');
  head.className = 'head';
  const cv = document.createElement('canvas');
  cv.width = 150; cv.height = 90;
  renderThumb(cv, spec);
  head.appendChild(cv);
  const name = document.createElement('div');
  name.className = 'name'; name.textContent = key;
  head.appendChild(name);
  col.appendChild(head);

  // ---------- 实例化一次：字段行只读读数与标定区块共用（calStats 来自同源 computeStats） ----------
  const calTank = makeTank({ x:0, y:0, hullAngle:0, turretAngle:0, team:'enemy', heightClass: spec.heightClass||'medium' });
  applyTankConfig(calTank, spec);
  const calStats = calTank.stats;
  const pxPerMeter = RULES.scale.PX_PER_METER;

  // 按四组 (firepower / armor / mobility / misc) 分区渲染
  const groups = [
    { key: 'firepower', label: '🔥 火力' },
    { key: 'armor',     label: '🛡️ 防护' },
    { key: 'mobility',  label: '⚡ 机动' },
    { key: 'misc',      label: '⚙️ 杂项' }
  ];

  for(const g of groups){
    const gRows = FIELD_ROWS.filter(r => r.group === g.key);
    if(!gRows.length) continue;

    const gHeader = document.createElement('div');
    gHeader.className = 'mrow';
    gHeader.style.borderTop = '1px solid var(--line)';
    gHeader.style.marginTop = '8px';
    gHeader.style.paddingTop = '4px';
    const gLbl = document.createElement('span');
    gLbl.className = 'lbl';
    gLbl.textContent = g.label;
    gLbl.style.color = 'var(--amber)';
    gLbl.style.fontWeight = '700';
    gHeader.appendChild(gLbl);
    col.appendChild(gHeader);

    for(const f of gRows){
      col.appendChild(renderRowField(spec, f, calStats));
      if(f.path === 'aimSpeed') col.appendChild(buildPrecisionRows(spec));
    }

    // P-48：只读派生（功重比 + 派生重量）内嵌于机动分组尾部
    if(g.key === 'mobility'){
      const dWeight = deriveWeight(spec);
      const ePow = getPath(spec, 'enginePower');
      const mobDerives = [
        ['功重比', (typeof ePow === 'number' && ePow > 0 && dWeight > 0) ? (ePow / dWeight).toFixed(1) + ' hp/t' : '—'],
        ['派生重量', dWeight > 0 ? dWeight.toFixed(1) + ' t' : '—']
      ];
      for(const [label, value] of mobDerives){
        const row = document.createElement('div');
        row.className = 'mrow';
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = label;
        const ro = document.createElement('span');
        ro.className = 'ro';
        ro.textContent = value;
        ro.style.color = 'var(--green)';
        row.appendChild(lbl);
        row.appendChild(ro);
        col.appendChild(row);
      }
    }
  }

  // P-48：原“真实单位标定”整块取消（各字段直接输入真实单位）
  const geoInfos = [
    ['车体顶点', spec.hull && spec.hull.verts ? spec.hull.verts.length : 5],
    ['车体面数', spec.hull && spec.hull.faces ? spec.hull.faces.length : 5],
    ['炮塔顶点', spec.turret && spec.turret.verts ? spec.turret.verts.length : 6],
    ['炮塔面数', spec.turret && spec.turret.faces ? spec.turret.faces.length : 6]
  ];
  for(const [g, n] of geoInfos){
    const row = document.createElement('div');
    row.className = 'mrow';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = g;
    const ro = document.createElement('span'); ro.className = 'ro'; ro.textContent = n + ' (只读)';
    row.appendChild(lbl); row.appendChild(ro);
    col.appendChild(row);
  }
  const tip = document.createElement('div');
  tip.className = 'ro'; tip.textContent = '多边形几何请用 tank_designer 编辑';
  tip.style.color = 'var(--text-dim)';
  col.appendChild(tip);

  const det = document.createElement('details');
  const sum = document.createElement('summary'); sum.textContent = '原始 JSON';
  det.appendChild(sum);
  const ta = document.createElement('textarea');
  ta.value = JSON.stringify(spec, null, 2);
  ta.addEventListener('change', ()=>{
    try {
      const parsed = JSON.parse(ta.value);
      Object.keys(parsed).forEach(k=>{ spec[k] = parsed[k]; });
      setStatus('JSON 已应用');
    } catch(e){ setStatus('JSON 错误: '+e.message); }
  });
  det.appendChild(ta);
  col.appendChild(det);
  return col;
}

function renderAll(){
  columnsEl.innerHTML = '';
  for(const key of Object.keys(list)){
    ensureDefaults(list[key]);
    columnsEl.appendChild(buildColumn(key, list[key]));
  }
}

// ---------- 载入 / 保存（tanks/ 一型一文件，js/tank_listio.js） ----------
function load(){
  setStatus('载入中…');
  fetchTankList(data => {
    if(!data){ setStatus('载入失败: 无法读取 tanks/ 目录'); return; }
    list = data;
    renderAll();
    setStatus('已载入 ' + Object.keys(list).length + ' 辆坦克');
  });
}
function save(){
  if(!list){ setStatus('尚未载入数据'); return; }
  saveTankList(list, failed => {
    if(failed.length === 0){
      setStatus('已保存到 tanks/ 目录 ✓');
    } else {
      failed.forEach(id => downloadTankFile(id, list[id]));
      setStatus(`保存失败 ${failed.length} 辆 ${failed.join(', ')} — 已下载，请手动放入 tanks/`);
    }
  });
}

document.getElementById('loadBtn').addEventListener('click', load);
document.getElementById('saveBtn').addEventListener('click', save);
load();
})();
</script>
</body>
</html>
