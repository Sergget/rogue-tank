<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>内容设计器 · Content Designer（卡牌 & Boss）</title>
<style>
  :root{
    --bg:#12140f; --panel:#1a1d15; --line:#3a3f2c; --amber:#ffb454; --amber-dim:#8a6a35;
    --green:#7ed957; --red:#ff5c4d; --blue:#5cc8ff; --text:#d9dcc9; --text-dim:#7a8065;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;height:100%;overflow:hidden;}
  .mono{font-family:'JetBrains Mono',Consolas,monospace;}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);}
  header h1{font-size:15px;letter-spacing:2px;margin:0;color:var(--amber);text-transform:uppercase;}
  header .hint{font-size:11px;color:var(--text-dim);}
  #tabs{display:flex;gap:6px;padding:10px 16px 0;}
  #tabs button{background:transparent;border:1px solid var(--line);color:var(--text-dim);
    font-size:12px;padding:6px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;}
  #tabs button.active{background:rgba(255,180,84,0.12);border-color:var(--amber);color:var(--amber);}
  #main{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 96px);}
  #list{border-right:1px solid var(--line);overflow-y:auto;padding:8px;}
  #list .item{border:1px solid transparent;padding:7px 10px;cursor:pointer;font-size:12px;line-height:1.5;}
  #list .item:hover{background:rgba(255,255,255,0.04);}
  #list .item.active{border-color:var(--amber);background:rgba(255,180,84,0.08);}
  #list .item .id{color:var(--amber-dim);font-family:Consolas,monospace;font-size:11px;}
  #list .item .meta{color:var(--text-dim);font-size:10px;}
  #editor{overflow-y:auto;padding:16px 20px;}
  #editor h2{font-size:13px;letter-spacing:1px;color:var(--amber-dim);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px;}
  .field{margin-bottom:10px;display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;}
  .field label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
  .field input,.field select,.field textarea{background:#0c0d09;border:1px solid var(--line);color:var(--text);
    font-size:12px;padding:5px 8px;font-family:Consolas,monospace;width:100%;}
  .field textarea{min-height:44px;resize:vertical;}
  .field input[type=number]{width:90px;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tags label{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px;}
  table th{color:var(--text-dim);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-weight:500;}
  table td{padding:3px 4px;}
  table input,table select{background:#0c0d09;border:1px solid var(--line);color:var(--text);font-size:11px;
    padding:3px 5px;font-family:Consolas,monospace;width:100%;min-width:60px;}
  table button{background:transparent;border:1px solid var(--red);color:var(--red);cursor:pointer;font-size:11px;padding:2px 6px;}
  .rowbtn{background:transparent;border:1px dashed var(--line);color:var(--text-dim);cursor:pointer;
    font-size:11px;padding:4px 10px;margin-top:4px;}
  .rowbtn:hover{border-color:var(--amber);color:var(--amber);}
  #toolbar{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  #toolbar button{background:transparent;border:1px solid var(--amber-dim);color:var(--amber);
    font-size:12px;padding:7px 14px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;}
  #toolbar button:hover{border-color:var(--amber);background:rgba(255,180,84,0.1);}
  #toolbar button.danger{border-color:var(--red);color:var(--red);}
  #status{margin-top:10px;font-size:11px;font-family:Consolas,monospace;white-space:pre-wrap;line-height:1.6;}
  #status.ok{color:var(--green);} #status.err{color:var(--red);}
</style>
</head>
<body>
<header>
  <h1>内容设计器 Content Designer</h1>
  <span class="hint">卡牌 Cards / Boss · 一型一文件（cards/ &amp; bosses/）· 保存即写回 JSON</span>
</header>
<div id="tabs">
  <button data-tab="cards" class="active">卡牌 Cards</button>
  <button data-tab="bosses">Boss</button>
</div>
<div id="main">
  <div id="list"></div>
  <div id="editor"></div>
</div>

<script src="../js/tank_cards.js"></script>
<script src="../js/tank_boss.js"></script>
<script>
(() => {
  let tab = 'cards';
  let cardData = {};   // id -> card
  let bossData = {};   // id -> boss
  let selected = null; // 当前编辑 id

  const $ = id => document.getElementById(id);
  const editor = $('editor'), listEl = $('list');

  // ---------- 数据加载 ----------
  async function load(){
    const [c, b] = await Promise.all([
      fetch('../api/cards').then(r => r.json()).catch(() => ({})),
      fetch('../api/bosses').then(r => r.json()).catch(() => ({}))
    ]);
    cardData = c; bossData = b;
    $('tabs').querySelector('[data-tab=cards]').textContent = `卡牌 Cards (${Object.keys(cardData).length})`;
    $('tabs').querySelector('[data-tab=bosses]').textContent = `Boss (${Object.keys(bossData).length})`;
    renderList();
    if(selected && (tab === 'cards' ? cardData : bossData)[selected]) renderEditor();
    else if(!selected) renderEditor();
  }

  // ---------- 列表 ----------
  function renderList(){
    const data = tab === 'cards' ? cardData : bossData;
    const ids = Object.keys(data).sort();
    listEl.innerHTML = '';
    for(const id of ids){
      const it = document.createElement('div');
      it.className = 'item' + (selected === id ? ' active' : '');
      if(tab === 'cards'){
        const c = data[id];
        it.innerHTML = `<div class="id">${c.id}</div><div>${c.name || ''}</div><div class="meta">${c.rarity || ''} · ${(c.tags||[]).join('/')}</div>`;
      } else {
        const b = data[id];
        it.innerHTML = `<div class="id">${b.id}</div><div>${b.name || ''}</div><div class="meta">${(b.stages||[]).length} 阶段</div>`;
      }
      it.addEventListener('click', () => { selected = id; renderList(); renderEditor(); });
      listEl.appendChild(it);
    }
  }

  // ---------- 编辑器 ----------
  function renderEditor(){
    editor.innerHTML = '';
    if(tab === 'cards') renderCardEditor();
    else renderBossEditor();
  }

  // 通用字段 helper
  function field(label, input){ const f = document.createElement('div'); f.className='field';
    const l = document.createElement('label'); l.textContent = label; f.appendChild(l); f.appendChild(input); return f; }
  function textInput(v, placeholder){ const i = document.createElement('input'); i.value = v || ''; i.placeholder = placeholder || ''; return i; }
  function numInput(v){ const i = document.createElement('input'); i.type='number'; i.value = v !== undefined ? v : ''; i.step='any'; return i; }
  function selInput(options, v){ const s = document.createElement('select');
    for(const o of options){ const op = document.createElement('option'); op.value = o; op.textContent = o; if(o === v) op.selected = true; s.appendChild(op); }
    return s; }
  function h2(t){ const h = document.createElement('h2'); h.textContent = t; editor.appendChild(h); return h; }

  function toolbar(extra){
    const tb = document.createElement('div'); tb.id='toolbar';
    const save = document.createElement('button'); save.textContent = '保存 SAVE'; save.addEventListener('click', () => saveCurrent());
    const add = document.createElement('button'); add.textContent = '新增 NEW'; add.addEventListener('click', () => addNew());
    const del = document.createElement('button'); del.className='danger'; del.textContent = '删除 DELETE'; del.addEventListener('click', () => deleteCurrent());
    const val = document.createElement('button'); val.textContent = '校验 VALIDATE'; val.addEventListener('click', () => validateCurrent());
    tb.appendChild(add); tb.appendChild(save); tb.appendChild(val); tb.appendChild(del);
    if(extra) tb.appendChild(extra);
    editor.appendChild(tb);
    const st = document.createElement('div'); st.id='status'; editor.appendChild(st);
  }

  function status(msg, ok){ const st = $('status'); if(!st) return; st.textContent = msg; st.className = ok ? 'ok' : 'err'; }

  // ---------- 卡牌编辑 ----------
  function renderCardEditor(){
    const card = cardData[selected] || { id:'', name:'', rarity:'common', tags:[], desc:'', effects:[], maxStacks:1 };
    h2('卡牌属性');
    const idI = textInput(card.id, 'card_id'); editor.appendChild(field('id', idI));
    const nameI = textInput(card.name, '名称'); editor.appendChild(field('名称', nameI));
    editor.appendChild(field('稀有度', selInput(CARD_RARITIES, card.rarity)));
    const descI = document.createElement('textarea'); descI.value = card.desc || ''; editor.appendChild(field('描述', descI));

    // tags
    const tagWrap = document.createElement('div'); tagWrap.className='tags';
    for(const t of CARD_TAGS){
      const lb = document.createElement('label');
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = (card.tags||[]).includes(t); cb.value = t;
      lb.appendChild(cb); lb.appendChild(document.createTextNode(t)); tagWrap.appendChild(lb);
    }
    editor.appendChild(field('流派标签', tagWrap));
    editor.appendChild(field('可叠上限', numInput(card.maxStacks || 1)));

    h2('效果 Effects');
    const tbl = document.createElement('table');
    const thead = document.createElement('tr'); thead.innerHTML = '<th>类型</th><th>参数</th><th></th>'; tbl.appendChild(thead);
    const effects = card.effects || [];
    function renderEffectRow(ef){
      const tr = document.createElement('tr');
      const typeSel = selInput(CARD_EFFECT_TYPES, ef.type);
      const paramTd = document.createElement('td');
      const delBtn = document.createElement('button'); delBtn.textContent = '×';
      function renderParams(){
        paramTd.innerHTML = '';
        switch(typeSel.value){
          case 'modifier': {
            const stat = textInput(ef.stat || '', 'penetration / armor.hull.front');
            const mode = selInput(['add','mult'], ef.mode || 'mult');
            const val = numInput(ef.value);
            paramTd.appendChild(stat); paramTd.appendChild(mode); paramTd.appendChild(val);
            break;
          }
          case 'ammo': {
            const key = selInput(AMMO_KEYS, ef.key); const fld = selInput(AMMO_FIELDS, ef.field);
            const mode = selInput(['add','mult'], ef.mode || 'mult'); const val = numInput(ef.value);
            paramTd.appendChild(key); paramTd.appendChild(fld); paramTd.appendChild(mode); paramTd.appendChild(val);
            break;
          }
          case 'ability': paramTd.appendChild(selInput(ABILITY_KEYS, ef.key)); break;
          case 'passive': { const key = selInput(PASSIVE_KEYS, ef.key); const val = numInput(ef.value); paramTd.appendChild(key); paramTd.appendChild(val); break; }
          case 'drone': paramTd.appendChild(document.createTextNode('—')); break;
          case 'economy': { const fld = selInput(ECONOMY_FIELDS, ef.field); const val = numInput(ef.value); paramTd.appendChild(fld); paramTd.appendChild(val); break; }
        }
      }
      typeSel.addEventListener('change', renderParams);
      renderParams();
      tr.appendChild(document.createElement('td')).appendChild(typeSel);
      tr.appendChild(paramTd);
      const dtd = document.createElement('td'); dtd.appendChild(delBtn); tr.appendChild(dtd);
      delBtn.addEventListener('click', () => tr.remove());
      tbl.appendChild(tr);
    }
    effects.forEach(renderEffectRow);
    editor.appendChild(tbl);
    const addEf = document.createElement('button'); addEf.className='rowbtn'; addEf.textContent = '+ 添加效果';
    addEf.addEventListener('click', () => { renderEffectRow({ type:'modifier', stat:'penetration', mode:'mult', value:1 }); });
    editor.appendChild(addEf);

    toolbar();

    // 读取表单 → 组装卡牌对象
    editor.__collect = () => {
      const tags = [...tagWrap.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
      const raritySel = editor.querySelectorAll('select')[0];
      const maxStacksI = editor.querySelectorAll('input[type=number]')[0];
      const effs = [];
      const rows = [...tbl.querySelectorAll('tr')].slice(1);
      for(const tr of rows){
        const t = tr.querySelector('select').value;
        const inputs = [...tr.querySelectorAll('input')];
        const sels = [...tr.querySelectorAll('select')];
        if(t === 'modifier') effs.push({ type:'modifier', stat: inputs[0].value, mode: sels[1].value, value: Number(inputs[1].value) });
        else if(t === 'ammo') effs.push({ type:'ammo', key: sels[1].value, field: sels[2].value, mode: sels[3].value, value: Number(inputs[0].value) });
        else if(t === 'ability') effs.push({ type:'ability', key: sels[1].value });
        else if(t === 'passive') effs.push({ type:'passive', key: sels[1].value, value: Number(inputs[0].value) || undefined });
        else if(t === 'drone') effs.push({ type:'drone' });
        else if(t === 'economy') effs.push({ type:'economy', field: sels[1].value, value: Number(inputs[0].value) });
      }
      return { id: idI.value, name: nameI.value, rarity: raritySel.value, desc: descI.value, tags, effects: effs, maxStacks: Number(maxStacksI.value) || 1 };
    };
  }

  // ---------- Boss 编辑 ----------
  function renderBossEditor(){
    const boss = bossData[selected] || { id:'', name:'', desc:'', tankId:'dummy', scale:1, stages:[], loot:{score:500, cardRarity:'legendary', cards:3} };
    h2('Boss 属性');
    const idI = textInput(boss.id, 'boss_id'); editor.appendChild(field('id', idI));
    const nameI = textInput(boss.name, '名称'); editor.appendChild(field('名称', nameI));
    const descI = document.createElement('textarea'); descI.value = boss.desc || ''; editor.appendChild(field('描述', descI));
    editor.appendChild(field('坦克 tankId', textInput(boss.tankId || 'dummy', '引用 tanks/<id>')));
    editor.appendChild(field('尺寸 scale', numInput(boss.scale || 1)));

    h2('阶段 Stages');
    const tbl = document.createElement('table');
    const thead = document.createElement('tr');
    thead.innerHTML = '<th>id</th><th>名称</th><th>hpFrom</th><th>hpTo</th><th>弱点(逗号分隔)</th><th></th>';
    tbl.appendChild(thead);
    function renderStageRow(st){
      const tr = document.createElement('tr');
      const cells = [textInput(st.id,'phase'), textInput(st.name,''), numInput(st.hpFrom), numInput(st.hpTo), textInput((st.weakspots||[]).join(','), 'ammo,engine')];
      for(const c of cells){ const td = document.createElement('td'); td.appendChild(c); tr.appendChild(td); }
      const dtd = document.createElement('td'); const db = document.createElement('button'); db.textContent='×';
      db.addEventListener('click', () => tr.remove()); dtd.appendChild(db); tr.appendChild(dtd);
      tbl.appendChild(tr);
    }
    (boss.stages || []).forEach(renderStageRow);
    editor.appendChild(tbl);
    const addSt = document.createElement('button'); addSt.className='rowbtn'; addSt.textContent='+ 添加阶段';
    addSt.addEventListener('click', () => renderStageRow({ id:'phase', name:'', hpFrom:1, hpTo:0, weakspots:[] }));
    editor.appendChild(addSt);

    h2('掉落 Loot');
    const scoreI = numInput((boss.loot||{}).score ?? 500); editor.appendChild(field('score', scoreI));
    editor.appendChild(field('cardRarity', selInput(['common','rare','epic','legendary'], (boss.loot||{}).cardRarity || 'legendary')));
    const cardsI = numInput((boss.loot||{}).cards ?? 3); editor.appendChild(field('掉落卡数', cardsI));

    toolbar();

    editor.__collect = () => {
      const stages = [];
      for(const tr of [...tbl.querySelectorAll('tr')].slice(1)){
        const ins = [...tr.querySelectorAll('input')];
        stages.push({ id: ins[0].value, name: ins[1].value, hpFrom: Number(ins[2].value), hpTo: Number(ins[3].value), weakspots: ins[4].value ? ins[4].value.split(',').map(s=>s.trim()).filter(Boolean) : [] });
      }
      const raritySel = editor.querySelectorAll('select')[0];
      return { id: idI.value, name: nameI.value, desc: descI.value, tankId: editor.querySelectorAll('input')[0].value, scale: Number(editor.querySelectorAll('input[type=number]')[0].value) || 1, stages, loot: { score: Number(scoreI.value) || 0, cardRarity: raritySel.value, cards: Number(cardsI.value) || 0 } };
    };
  }

  // ---------- 操作 ----------
  function saveCurrent(){
    const obj = editor.__collect && editor.__collect();
    if(!obj || !obj.id){ status('id 不能为空', false); return; }
    const base = tab === 'cards' ? '../api/cards' : '../api/bosses';
    fetch(`${base}/${encodeURIComponent(obj.id)}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(obj, null, 2)
    }).then(r => r.json()).then(res => {
      if(res.success){ status(`已保存 ${obj.id}.json`, true); load(); }
      else status('保存失败: ' + (res.error || ''), false);
    }).catch(e => status('保存失败: ' + e.message, false));
  }
  function addNew(){
    selected = null;
    if(tab === 'cards'){ editor.innerHTML=''; renderCardEditor(); }
    else { editor.innerHTML=''; renderBossEditor(); }
    // 聚焦 id 输入
    const idI = editor.querySelector('input');
    if(idI) idI.focus();
  }
  function deleteCurrent(){
    if(!selected){ status('未选中条目', false); return; }
    if(!confirm(`删除 ${selected}?`)) return;
    const base = tab === 'cards' ? '../api/cards' : '../api/bosses';
    fetch(`${base}/${encodeURIComponent(selected)}`, { method:'DELETE' }).then(r => r.json()).then(res => {
      if(res.success){ status(`已删除 ${selected}.json`, true); selected = null; load(); }
      else status('删除失败: ' + (res.error || ''), false);
    });
  }
  function validateCurrent(){
    const obj = editor.__collect && editor.__collect();
    if(!obj){ status('无内容可校验', false); return; }
    const errs = tab === 'cards' ? validateCard(obj) : validateBoss(obj);
    status(errs.length ? '校验失败:\n' + errs.join('\n') : '校验通过 ✓', errs.length === 0);
  }

  // ---------- tab 切换 ----------
  $('tabs').addEventListener('click', e => {
    const btn = e.target.closest('button'); if(!btn) return;
    tab = btn.dataset.tab;
    $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    selected = null;
    renderList(); renderEditor();
  });

  load();
})();
</script>
</body>
</html>
